<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта</title>
    <style>
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }
        #overlay .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 9999;
        }
        #overlay button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="overlay-content">
            <h2>Интерактивная карта</h2>
            <button onclick="openMap()">Поехали!</button>
        </div>
    </div>

    <script>
        function openMap() {
            // Вместо карты от спутника, можно использовать обычную геопозиционированию для примера
            const map = {
                coordinates: {lat: 55.7558, lng: 37.6173}, // Пример координат
                zoom: 10
            };
            const mapContainer = document.createElement('div');
            mapContainer.style.position = 'fixed';
            mapContainer.style.top = `${map.zoom * 10}px`; // Предполагаемая высота карты в пикселях
            mapContainer.style.width = '100vw';
            mapContainer.style.height = '100vh';
            document.body.appendChild(mapContainer);

            // Простой пример геопозиционирования
            const position = {
                lat: map.coordinates.lat,
                lng: map.coordinates.lng
            };

            // Показать карту
            showMap(map, position);
        }

        function showMap(map, position) {
            // Здесь можно реализовать взаимодействие с картой (пример геопозиционирования)
            console.log(`Запрос на карту с координатами: ${position.lat}, ${position.lng}`);
        }
    </script>

    <script>
        // Простая функция для отображения/скрытия контейнера с меню
        function toggleOverlay() {
            const overlay = document.getElementById('overlay');
            if (overlay.style.display === 'none') {
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        }

        // Обработчик события клика на кнопке
        document.querySelector('button').addEventListener('click', toggleOverlay);
    </script>
</body>
</html>

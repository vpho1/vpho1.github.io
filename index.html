<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раен Балашиха</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d0d0d; color: #eee; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  #auth { align-items: center; justify-content: center; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 90%; max-width: 360px; }
  .card h1 { text-align: center; margin-bottom: 20px; color: #e53935; letter-spacing: 1px; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid #333; }
  .tabs button { flex: 1; padding: 10px; background: none; border: none; color: #888; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #fff; border-bottom-color: #e53935; }
  form { display: none; flex-direction: column; }
  form.active { display: flex; }
  input { padding: 11px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; width: 100%; }
  input:focus { outline: none; border-color: #e53935; }
  .error { color: #ff5252; font-size: 14px; min-height: 18px; margin-bottom: 8px; text-align: center; }
  .btn { padding: 12px; background: #e53935; border: none; color: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .btn:hover { background: #c62828; }
  .btn.secondary { background: #333; }
  .btn.secondary:hover { background: #444; }

  #menu { align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 20px; }
  #menu h1 { font-size: 40px; color: #e53935; letter-spacing: 2px; }
  #menu p { color: #aaa; text-align: center; }
  #menu .menu-btns { width: 90%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }
  #invites { width: 90%; max-width: 300px; }

  #game { flex-direction: column; height: 100vh; position: relative; }
  .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #1a1a1a; border-bottom: 1px solid #333; }
  .topbar span { font-weight: bold; color: #e53935; }
  .topbar .btn { width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
  #map { flex: 1; width: 100%; }
  #hint { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #e53935; color: #fff; padding: 10px 12px; border-radius: 8px; z-index: 500; display: none; font-size: 14px; text-align: center; min-width: 260px; }
  #hint.active { display: block; }
  #hint .hint-btns { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
  #hint .hint-btns button { padding: 8px 12px; border: none; border-radius: 6px; color: #fff; background: #e53935; cursor: pointer; font-size: 14px; }
  #hint .hint-btns button.secondary { background: #333; }
  #hint .hidden { display: none; }
  .leaflet-tooltip { background: #1a1a1a; color: #fff; border: 1px solid #444; font-size: 13px; }

  .side-btn { position: absolute; left: 10px; top: 120px; z-index: 500; width: auto; padding: 10px 12px; font-size: 14px; margin: 0; display: none; }

  .man { position: relative; width: 8px; height: 14px; }
  .man::before { content: ''; position: absolute; top: 0; left: 2px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .man::after { content: ''; position: absolute; top: 5px; left: 0; width: 8px; height: 9px; border-radius: 2px; background: currentColor; }
  .man.att { color: #ffeb3b; animation: marchR 0.6s ease-in-out infinite alternate; }
  .man.def { color: #4fc3f7; animation: marchL 0.6s ease-in-out infinite alternate; }
  @keyframes marchR { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  @keyframes marchL { from { transform: translateX(2px); } to { transform: translateX(-3px); } }

  .sq { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; color: #fff; font: bold 12px Arial; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 4px #000; }
  .sq.merc { border-style: dashed; }
  .bld { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #fff; color: #fff; font: bold 13px Arial; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 4px #000; background: #222; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-bg.active { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 22px; width: 90%; max-width: 360px; max-height: 90vh; overflow-y: auto; color: #eee; }
  .modal h2 { color: #e53935; margin-bottom: 12px; font-size: 20px; }
  .modal p { margin-bottom: 8px; line-height: 1.4; }
  .modal select { width: 100%; padding: 11px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; }
  .inv { background: #222; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .inv p { margin-bottom: 8px; font-size: 14px; }
  .inv .btn { width: auto; display: inline-block; padding: 8px 12px; font-size: 14px; margin-right: 6px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #e53935; color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 1500; display: none; font-size: 14px; max-width: 90%; text-align: center; }
  #toast.active { display: block; }
</style>
</head>
<body>

<div id="auth" class="screen active">
  <div class="card">
    <h1>РАЕН БАЛАШИХА</h1>
    <div class="tabs">
      <button id="tabLogin" class="active">Вход</button>
      <button id="tabRegister">Регистрация</button>
    </div>
    <form id="loginForm" class="active">
      <input type="email" id="loginEmail" placeholder="Почта" required>
      <input type="password" id="loginPass" placeholder="Пароль" required>
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn">Войти</button>
    </form>
    <form id="registerForm">
      <input type="text" id="regNick" placeholder="Никнейм" required>
      <input type="text" id="regCallsign" placeholder="Позывной" required>
      <input type="email" id="regEmail" placeholder="Почта" required>
      <input type="password" id="regPass" placeholder="Пароль (минимум 6 символов)" required>
      <div class="error" id="regError"></div>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
  </div>
</div>

<div id="menu" class="screen">
  <h1>РАЕН</h1>
  <p id="welcome"></p>
  <p id="money"></p>
  <div id="invites"></div>
  <div class="menu-btns">
    <button class="btn" id="btnPlay">Начать игру</button>
    <button class="btn secondary" id="btnGroups">Группировки</button>
    <button class="btn secondary" id="btnAdmin">Админка</button>
    <button class="btn secondary" id="btnLogout">Выйти</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <span>Балашиха</span>
    <button class="btn secondary" id="btnBack">← В меню</button>
  </div>
  <div id="map"></div>
  <button class="btn secondary side-btn" id="btnSquads">Отряды</button>
  <div id="hint">
    <div id="hintText"></div>
    <div class="hint-btns">
      <button id="hintUndo" class="hidden">Убрать точку</button>
      <button id="hintDone" class="hidden">Готово</button>
      <button id="hintCancel" class="secondary">Отмена</button>
    </div>
  </div>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ================= НАСТРОЙКИ =================
const MAX_MEMBERS = 30;
const MERC_PRICE = 100;
const MERC_TIME = 10 * 60 * 1000;
const HOSPITAL_TIME = 30 * 1000;
const START_MONEY = 1000;
const SECTOR_R = 35;
const SQUAD_SPEED = 12;
const ADMIN_PASS = '1234-qwer-4321';

const BUILD = {
  gym:    { name: 'Качалка', cost: 300,  limit: 1, icon: 'К', color: '#ef6c00', periodMs: 2 * 60 * 1000, gain: { men: 1 } },
  stall:  { name: 'Ларёк',   cost: 100,  limit: 4, icon: 'Л', color: '#00838f', periodMs: 60 * 1000,     gain: { money: 10 } },
  market: { name: 'Рынок',   cost: 5000, limit: 1, icon: 'Р', color: '#f9a825', periodMs: 60 * 1000,     gain: { money: 450 } }
};

const DEFS = [
  {
    id: 'univ', name: 'Универсам', color: '#2e7d32',
    coords: [
      [37.9715151,55.830116],[37.9716861,55.8329778],[37.9720623,55.8335059],[37.9724042,55.8338516],
      [37.9726094,55.8341973],[37.972712,55.8347158],[37.9729514,55.8357145],[37.9731395,55.8358489],
      [37.9775388,55.8361843],[37.9799971,55.8363796],[37.9813945,55.8364301],[37.9827356,55.8363598],
      [37.9827506,55.8362197],[37.9771303,55.8300152],[37.9715188,55.8301033],[37.971515,55.830116]
    ]
  },
  {
    id: 'kino', name: 'Кинопленка', color: '#7b1fa2',
    coords: [
      [37.9714177,55.8302632],[37.9692348,55.8303511],[37.9675265,55.8303876],[37.9674011,55.8303437],
      [37.9673033,55.8302627],[37.967233,55.8301454],[37.9669636,55.8301165],[37.9668064,55.8301315],
      [37.9667602,55.8301906],[37.9666925,55.8302589],[37.9661644,55.8301113],[37.9660459,55.8297948],
      [37.9652847,55.8296129],[37.9650373,55.8297665],[37.9648258,55.8297606],[37.9636098,55.8293478],
      [37.9617242,55.8313916],[37.9616905,55.831552],[37.961707,55.8316989],[37.961803,55.8318712],
      [37.9620437,55.8320218],[37.9643258,55.8331658],[37.9654062,55.8334938],[37.9658121,55.8335949],
      [37.9664041,55.8336715],[37.9671743,55.8337178],[37.9681281,55.8337385],[37.9717806,55.8335139],
      [37.9714178,55.8302633],[37.9713574,55.8302547]
    ]
  },
  {
    id: 'chainiki', name: 'Чайники', color: '#757575',
    coords: [
      [37.9713474,55.8302366],[37.96923,55.8302822],[37.967532,55.8302476],[37.9672775,55.8300489],
      [37.9668316,55.8299979],[37.9664408,55.830046],[37.9662634,55.829985],[37.9660489,55.8297247],
      [37.9662013,55.8295276],[37.9655731,55.8293228],[37.9640728,55.8289181],[37.9668417,55.8259621],
      [37.9672796,55.8260639],[37.9689658,55.82604],[37.9692017,55.8258553],[37.9699848,55.8258091],
      [37.97095,55.8257788],[37.9711901,55.8258002],[37.9713471,55.8302366],[37.9712636,55.8302028]
    ]
  }
];

// ================= ХРАНИЛИЩЕ (в браузере) =================
const K_USERS = 'raen2_users', K_SESSION = 'raen2_session', K_GROUPS = 'raen2_groups',
      K_SECTORS = 'raen2_sectors', K_SQUADS = 'raen2_squads';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } };

let users = load(K_USERS, {});
let sectors = load(K_SECTORS, []);
let squads = load(K_SQUADS, []);
let groups = loadGroups();
let currentEmail = null;

function loadGroups() {
  const saved = load(K_GROUPS, {});
  DEFS.forEach(d => {
    const g = saved[d.id] || {};
    saved[d.id] = {
      leader: g.leader || null,
      members: g.members || [],
      enemies: g.enemies || [],
      challenges: g.challenges || [],
      mercs: g.mercs || [],
      letters: g.letters || [],
      zone: g.zone !== undefined ? g.zone : d.coords.map(c => [c[1], c[0]]),
      buildings: g.buildings || [],
      money: g.money || 0,
      bonusMen: g.bonusMen || 0
    };
  });
  return saved;
}

function saveAll() {
  localStorage.setItem(K_USERS, JSON.stringify(users));
  localStorage.setItem(K_GROUPS, JSON.stringify(groups));
  localStorage.setItem(K_SECTORS, JSON.stringify(sectors));
  localStorage.setItem(K_SQUADS, JSON.stringify(squads));
}

async function hashPass(text) {
  if (!window.crypto || !crypto.subtle) return text;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// ================= ПОМОЩНИКИ =================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = () => Math.random().toString(36).slice(2, 9);
const me = () => users[currentEmail];
const gdef = id => DEFS.find(d => d.id === id);
const gname = id => gdef(id).name;
const gcolor = id => gdef(id).color;
const displayName = e => users[e] ? `${users[e].nick} (${users[e].callsign})` : '—';
const leaderName = gid => groups[gid].leader ? esc(displayName(groups[gid].leader)) : 'нет';
const fmtTime = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const inHospital = e => !!users[e] && (users[e].hospitalUntil || 0) > Date.now();
const isLeaderOf = gid => { const u = me(); return !!u && u.group === gid && u.role === 'leader'; };

function cleanMercs(gid) {
  const g = groups[gid];
  g.mercs = g.mercs.filter(m => m.exp > Date.now());
  return g.mercs;
}
function freeMen(gid) { return groups[gid].members.filter(e => users[e] && !inHospital(e)).length; }
function mercCount(gid) { return cleanMercs(gid).length; }

function squadsOf(gid) { return squads.filter(s => s.gid === gid); }
function reservedMen(gid) { return squadsOf(gid).filter(s => s.kind === 'men').reduce((a, s) => a + s.count, 0); }
function reservedMercs(gid) { return squadsOf(gid).filter(s => s.kind === 'merc').reduce((a, s) => a + s.count, 0); }
function freeMenTotal(gid) { return freeMen(gid) + groups[gid].bonusMen; }
function menPoolTotal(gid) { return Math.max(0, freeMenTotal(gid) - reservedMen(gid)); }
function mercPool(gid) { return Math.max(0, mercCount(gid) - reservedMercs(gid)); }
function available(gid) { return menPoolTotal(gid) + mercPool(gid); }

function sendToHospital(gid, count) {
  const g = groups[gid];
  const until = Date.now() + HOSPITAL_TIME;
  let left = count;
  for (const e of g.members) {
    if (left <= 0) break;
    if (!users[e] || inHospital(e)) continue;
    users[e].hospitalUntil = until;
    left--;
  }
  const mercs = cleanMercs(gid);
  mercs.splice(0, Math.min(left, mercs.length));
}
function endWar(a, b) {
  groups[a].enemies = groups[a].enemies.filter(x => x !== b);
  groups[b].enemies = groups[b].enemies.filter(x => x !== a);
  groups[a].challenges = groups[a].challenges.filter(c => c.from !== b);
  groups[b].challenges = groups[b].challenges.filter(c => c.from !== a);
}
function captureSector(lat, lng, owner) {
  sectors.push({ id: rnd(), lat, lng, owner });
}
function distM(lat1, lng1, lat2, lng2) {
  const dy = (lat2 - lat1) * 111320;
  const dx = (lng2 - lng1) * 111320 * Math.cos(lat1 * Math.PI / 180);
  return Math.hypot(dx, dy);
}
function inPoly(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function ownerAt(lat, lng) {
  for (let i = sectors.length - 1; i >= 0; i--) {
    const s = sectors[i];
    if (distM(lat, lng, s.lat, s.lng) <= SECTOR_R) return s.owner;
  }
  for (const d of DEFS) {
    const z = groups[d.id].zone;
    if (z && inPoly(lat, lng, z)) return d.id;
  }
  return null;
}
function baseOf(gid) {
  const z = groups[gid].zone;
  if (!z) return null;
  return {
    lat: z.reduce((a, p) => a + p[0], 0) / z.length,
    lng: z.reduce((a, p) => a + p[1], 0) / z.length
  };
}

// ================= ЭКРАНЫ И МОДАЛКА =================
const screens = { auth: $('auth'), menu: $('menu'), game: $('game') };
function showScreen(n) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[n].classList.add('active');
}

const modalBg = $('modalBg'), modalBody = $('modalBody');
let modalActs = {};
modalBody.addEventListener('click', e => {
  const a = e.target.dataset.act;
  if (a && modalActs[a]) modalActs[a]();
});
function openModal(html, acts = {}) {
  modalActs = { close: closeModal, ...acts };
  modalBody.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal() { modalBg.classList.remove('active'); }
function msg(text) {
  openModal(`<p>${esc(text)}</p><button class="btn" data-act="close">OK</button>`);
}

let toastTimer = null;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('active');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('active'), 4000);
}

// ================= ВХОД / РЕГИСТРАЦИЯ =================
$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
  $('loginForm').classList.add('active'); $('registerForm').classList.remove('active');
};
$('tabRegister').onclick = () => {
  $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
  $('registerForm').classList.add('active'); $('loginForm').classList.remove('active');
};

$('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('regError'); err.textContent = '';
  const nick = $('regNick').value.trim();
  const callsign = $('regCallsign').value.trim();
  const email = $('regEmail').value.trim().toLowerCase();
  const pass = $('regPass').value;
  if (!nick || !callsign || !email || !pass) { err.textContent = 'Заполните все поля'; return; }
  if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
  if (users[email]) { err.textContent = 'Такая почта уже зарегистрирована'; return; }
  if (Object.values(users).some(u => u.nick.toLowerCase() === nick.toLowerCase())) { err.textContent = 'Такой ник уже занят'; return; }
  users[email] = {
    nick, callsign, pass: await hashPass(pass),
    group: null, role: null, money: START_MONEY, invites: [], hospitalUntil: 0
  };
  saveAll();
  e.target.reset();
  login(email);
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('loginError'); err.textContent = '';
  const email = $('loginEmail').value.trim().toLowerCase();
  const u = users[email];
  if (!u) { err.textContent = 'Пользователь не найден'; return; }
  if (u.pass !== await hashPass($('loginPass').value)) { err.textContent = 'Неверный пароль'; return; }
  e.target.reset();
  login(email);
});

function login(email) {
  currentEmail = email;
  localStorage.setItem(K_SESSION, email);
  renderMenu();
  showScreen('menu');
}

$('btnLogout').onclick = () => {
  localStorage.removeItem(K_SESSION);
  currentEmail = null;
  cancelMode();
  closeModal();
  showScreen('auth');
};

// ================= МЕНЮ =================
function renderMenu() {
  const u = me();
  const g = u.group ? ` | группировка: ${gname(u.group)} (${u.role === 'leader' ? 'главный' : 'шпана'})` : '';
  $('welcome').innerHTML = `Привет, ${esc(u.nick)} (${esc(u.callsign)})${g}`;
  const hosp = inHospital(currentEmail) ? ` | в больнице до ${fmtTime(u.hospitalUntil)}` : '';
  $('money').textContent = `Деньги: ${u.money} руб${hosp}`;
  renderInvites();
  updateSideBtn();
}

function renderInvites() {
  const u = me();
  let h = '';
  (u.invites || []).forEach((inv, i) => {
    h += `<div class="inv">
      <p>Приглашение в «${esc(gname(inv.gid))}» от ${esc(inv.from)}</p>
      <button class="btn" data-inv="acc:${i}">Принять</button>
      <button class="btn secondary" data-inv="dec:${i}">Нет</button>
    </div>`;
  });
  if (u.group && u.role === 'leader') {
    const gr = groups[u.group];
    if (gr.challenges.length) {
      h += `<div class="inv"><p>Вызовов на бой: ${gr.challenges.length}</p>
        <button class="btn" data-inv="chal">Открыть вызовы</button></div>`;
    }
    if (gr.letters.length) {
      h += `<div class="inv"><p>Писем о мире: ${gr.letters.length}</p>
        <button class="btn" data-inv="let">Открыть письма</button></div>`;
    }
  }
  $('invites').innerHTML = h;
}

$('invites').addEventListener('click', e => {
  const a = e.target.dataset.inv;
  if (!a) return;
  const [k, idx] = a.split(':');
  if (k === 'acc') acceptInvite(+idx);
  else if (k === 'dec') declineInvite(+idx);
  else if (k === 'chal') showOwnGroup(me().group);
  else if (k === 'let') showLetters(me().group);
});

function acceptInvite(i) {
  const u = me();
  const inv = u.invites[i];
  u.invites.splice(i, 1);
  if (u.group) { saveAll(); return msg('Вы уже в группировке.'); }
  const g = groups[inv.gid];
  if (g.members.length >= MAX_MEMBERS) { saveAll(); return msg('Нет мест в группировке.'); }
  g.members.push(currentEmail);
  u.group = inv.gid; u.role = 'member';
  saveAll(); renderMenu();
  msg(`Вы вступили в «${gname(inv.gid)}».`);
}
function declineInvite(i) {
  me().invites.splice(i, 1);
  saveAll(); renderMenu();
}

function showOwnGroup(gid) {
  const u = me();
  if (!gid || u.group !== gid) return;
  const g = groups[gid];
  const isLeader = u.role === 'leader';
  const mercs = cleanMercs(gid);
  const mercEnd = mercs.length ? ` (до ${fmtTime(Math.max(...mercs.map(m => m.exp)))})` : '';
  const en = g.enemies.length ? g.enemies.map(x => esc(gname(x))).join(', ') : 'ни с кем';

  let h = `
    <h2>${esc(gname(gid))}</h2>
    <p>Лидер: ${leaderName(gid)}</p>
    <p>Людей: ${g.members.length} / ${MAX_MEMBERS}</p>
    <p>Наёмники: ${mercs.length}${mercEnd}</p>
    <p>Доступно в бой: ${available(gid)}</p>
    <p>Отрядов: ${squadsOf(gid).length}</p>
    <p>Казна: ${g.money} руб</p>
    <p>Воюет с: ${en}</p>
    <p>Территория: ${g.zone ? 'нарисована' : 'не нарисована'}</p>
    <p>Вы: ${isLeader ? 'главный' : 'шпана'}</p>`;
  const acts = {};

  if (isLeader) {
    g.challenges.forEach(ch => {
      h += `<div class="inv">
        <p>Вызов от «${esc(gname(ch.from))}»: атакующих ${ch.attackers}</p>
        <button class="btn" data-act="def:${ch.id}">Защищать</button>
      </div>`;
      acts['def:' + ch.id] = () => showDefend(gid, ch.id);
    });
    h += `
      <button class="btn" data-act="squads">Отряды</button>
      <button class="btn" data-act="build">Стройка</button>
      <button class="btn" data-act="war">Война</button>
      <button class="btn" data-act="trade">Торговля</button>
      <button class="btn" data-act="diplo">Дипломатия</button>`;
    acts.squads = () => showSquadsMenu(gid);
    acts.build = () => showBuildMenu(gid);
    acts.war = () => showWarMenu(gid);
    acts.trade = () => msg('Торговля: скоро');
    acts.diplo = () => showDiplo(gid);
  } else {
    const label = g.leader ? `Стать лидером (сейчас: ${displayName(g.leader)})` : 'Стать главным';
    h += `<button class="btn secondary" data-act="takeover">${esc(label)}</button>`;
    acts.takeover = () => takeLeadership(gid);
  }

  h += `
    <button class="btn" data-act="call">Позвать чушпанов</button>
    <button class="btn" data-act="merc">Наёмники с Раена</button>
    <button class="btn secondary" data-act="leave">Выйти из группировки</button>`;
  acts.call = () => showInvite(gid);
  acts.merc = () => showMercs(gid);
  acts.leave = () => leaveGroup(gid);

  openModal(h, acts);
}

function takeLeadership(gid) {
  if (!confirm('Стать главным этой группировки?')) return;
  const g = groups[gid];
  if (g.leader && users[g.leader]) users[g.leader].role = 'member';
  g.leader = currentEmail;
  me().role = 'leader';
  saveAll(); renderMenu();
  showOwnGroup(gid);
}

function leaveGroup(gid) {
  const g = groups[gid];
  g.members = g.members.filter(e => e !== currentEmail);
  if (g.leader === currentEmail) g.leader = null;
  me().group = null; me().role = null;
  saveAll(); renderMenu();
  msg(`Вы вышли из «${gname(gid)}».`);
}

function inviteByNick(gid, nick) {
  const name = nick.trim().toLowerCase();
  if (!name) return msg('Введите ник.');
  const target = Object.keys(users).find(e => users[e].nick.toLowerCase() === name);
  if (!target) return msg('Игрок с таким ником не найден.');
  if (target === currentEmail) return msg('Себя звать не надо.');
  if (users[target].group) return msg('Он уже в группировке.');
  if (groups[gid].members.length >= MAX_MEMBERS) return msg('Нет мест.');
  users[target].invites = users[target].invites || [];
  users[target].invites.push({ gid, from: displayName(currentEmail) });

  msg(`Приглашение отправлено: ${users[target].nick}.`);
}

function buyMercs(gid) {
  const n = parseInt($('mercN').value, 10);
  if (!(n >= 1)) return msg('Введите число больше 0.');
  const cost = n * MERC_PRICE;
  if (me().money < cost) return msg(`Не хватает денег. Нужно ${cost} руб, у вас ${me().money} руб.`);
  const exp = Date.now() + MERC_TIME;
  for (let i = 0; i < n; i++) groups[gid].mercs.push({ exp });
  me().money -= cost;
  saveAll(); renderMenu();
  msg(`Нанято ${n} наёмн. Служат до ${fmtTime(exp)}.`);
}

function startBuild(gid, type) {
  const b = BUILD[type];
  if (countBuilt(gid, type) >= b.limit) return msg(`Лимит: ${b.name} можно построить не больше ${b.limit} шт.`);
  if (groups[gid].money < b.cost) return msg(`Не хватает денег в казне. Нужно ${b.cost} руб, в казне ${groups[gid].money} руб.`);
  startMode('build', gid, `Нажмите точку на своей территории, где построить «${b.name}».`, { type });
}

function placeBuilding(gid, type, ll) {
  const b = BUILD[type];
  if (ownerAt(ll.lat, ll.lng) !== gid) return msg('Строить можно только на своей территории.');
  const g = groups[gid];
  if (countBuilt(gid, type) >= b.limit) return msg(`Лимит: ${b.name} уже построено.`);
  if (g.money < b.cost) return msg('Не хватает денег в казне.');
  g.money -= b.cost;
  g.buildings.push({ id: rnd(), type, lat: ll.lat, lng: ll.lng, lastGain: Date.now() });
  saveAll(); refreshMap();
  msg(`«${b.name}» построена.`);
}

// Доход: считается по прошедшему времени, даже если сайт был закрыт
function applyIncome() {
  const now = Date.now();
  let changed = false;
  Object.values(groups).forEach(g => {
    g.buildings.forEach(bl => {
      const def = BUILD[bl.type];
      const ticks = Math.floor((now - bl.lastGain) / def.periodMs);
      if (ticks > 0) {
        if (def.gain.money) g.money += ticks * def.gain.money;
        if (def.gain.men) g.bonusMen += ticks * def.gain.men;
        bl.lastGain += ticks * def.periodMs;
        changed = true;
      }
    });
  });
  if (changed) saveAll();
}

function createSquad(gid, kind, name, nRaw) {
  const n = parseInt(nRaw, 10);
  const pool = kind === 'men' ? menPoolTotal(gid) : mercPool(gid);
  if (!(n >= 1) || n > pool) return msg(`Введите число от 1 до ${pool}.`);
  const b = baseOf(gid);
  if (!b) return msg('Сначала нарисуйте территорию.');
  const k = squadsOf(gid).length;
  squads.push({
    id: rnd(), gid, kind,
    name: (name || '').trim() || `Отряд ${k + 1}`,
    count: n,
    lat: b.lat + k * 0.00006,
    lng: b.lng + (k % 2) * 0.00006,
    state: 'idle'
  });
  saveAll();
  refreshMap();
  msg('Отряд создан на вашей территории. Нажмите на него на карте, чтобы отправить.');
}

function openSquadMenu(sid) {
  const s = squads.find(x => x.id === sid);
  if (!s) return;
  const busy = s.state === 'waiting';
  openModal(`
    <h2>Отряд «${esc(s.name)}»</h2>
    <p>Состав: ${s.kind === 'merc' ? 'наёмники' : 'пацаны'}, ${s.count} чел.</p>
    <p>Статус: ${SQ_STATE[s.state]}</p>
    ${busy ? '<p>Отряд в бою, ждёт решения лидера.</p>' : `
      <button class="btn" data-act="go">Отправить на точку</button>
      <button class="btn secondary" data-act="base">Вернуть на базу</button>
      <button class="btn secondary" data-act="dis">Расформировать</button>`}
    <button class="btn secondary" data-act="back">Назад к отрядам</button>
  `, {
    go: () => { closeModal(); startDest(s.id); },
    base: () => {
      const b = baseOf(s.gid);
      closeModal();
      if (b) moveSquad(s.id, b.lat, b.lng);
    },
    dis: () => {
      if (!confirm('Расформировать отряд?')) return;
      squads = squads.filter(x => x.id !== s.id);
      saveAll(); refreshMap();
      showSquadsMenu(s.gid);
    },
    back: () => showSquadsMenu(s.gid)
  });
}

function startDest(sid) {
  const s = squads.find(x => x.id === sid);
  if (!s) return;
  startMode('dest', s.gid, `Нажмите точку на карте, куда отправить отряд «${s.name}».`, {}, sid);
}

function squadPos(s, t) {
  if (s.state !== 'moving') return { lat: s.lat, lng: s.lng };
  const f = Math.min(1, Math.max(0, (t - s.startT) / (s.endT - s.startT)));
  return {
    lat: s.fromLat + (s.toLat - s.fromLat) * f,
    lng: s.fromLng + (s.toLng - s.fromLng) * f
  };
}

function moveSquad(sid, lat, lng) {
  const s = squads.find(x => x.id === sid);
  if (!s) return;
  const now = Date.now();
  const p = squadPos(s, now);
  const dist = distM(p.lat, p.lng, lat, lng);
  const dur = Math.max(2000, dist / SQUAD_SPEED * 1000);
  Object.assign(s, {
    lat: p.lat, lng: p.lng,
    fromLat: p.lat, fromLng: p.lng,
    toLat: lat, toLng: lng,
    startT: now, endT: now + dur,
    state: 'moving'
  });
  saveAll();
  refreshMap();
  toast(`Отряд «${s.name}» выдвинулся. Прибудет через ${Math.ceil(dur / 1000)} сек.`);
}

function arrive(s) {
  s.lat = s.toLat; s.lng = s.toLng; s.state = 'idle';
  const t = ownerAt(s.lat, s.lng);

  if (t === s.gid) return toast(`Отряд «${s.name}» на своей территории.`);
  if (t === null) {
    captureSector(s.lat, s.lng, s.gid);
    return toast(`Отряд «${s.name}» захватил нейтральную точку.`);
  }
  if (!groups[s.gid].enemies.includes(t)) {
    return toast(`Отряд «${s.name}»: вы не воюете с «${gname(t)}». Ждёт приказа.`);
  }
  const tg = groups[t];
  if (!tg.leader) {
    captureSector(s.lat, s.lng, s.gid);
    return toast(`У «${gname(t)}» нет главаря. Отряд «${s.name}» забрал точку.`);
  }
  s.state = 'waiting';
  tg.challenges.push({ id: rnd(), from: s.gid, lat: s.lat, lng: s.lng, attackers: s.count, squadId: s.id });
  toast(`Отряд «${s.name}» вступил в бой за точку «${gname(t)}». Ждём ответа лидера.`);
}

let tickTimer = setInterval(tick, 1000);
function tick() {
  if (!currentEmail) return;
  applyIncome();
  const now = Date.now();
  let changed = false;
  squads.forEach(s => {
    if (s.state === 'moving' && now >= s.endT) { arrive(s); changed = true; }
  });
  if (changed) { saveAll(); refreshMap(); }
  else if (squads.some(s => s.state === 'moving') && map) refreshSquads();
}

function handleAttackPoint(from, ll) {
  const target = ownerAt(ll.lat, ll.lng);
  if (!target) {
    captureSector(ll.lat, ll.lng, from);
    saveAll(); refreshMap();
    return msg(`Точка ничья. «${gname(from)}» забирает её без боя.`);
  }
  if (target === from) return msg('Это уже ваша территория. Выберите чужую.');
  if (!groups[from].enemies.includes(target)) return msg(`Вы не воюете с «${gname(target)}». Сначала объявите войну.`);
  const avail = available(from);
  if (avail < 1) return msg('Нет доступных людей: все в больнице, в отрядах или наёмники закончились.');
  openModal(`
    <h2>Атака</h2>
    <p>Точка у «${esc(gname(target))}».</p>
    <p>Доступно людей: ${avail}</p>
    <input type="number" id="atkN" min="1" max="${avail}" value="${avail}">
    <button class="btn" data-act="send">Отправить</button>
    <button class="btn secondary" data-act="close">Отмена</button>
  `, {
    send: () => {
      const n = parseInt($('atkN').value, 10);
      if (!(n >= 1) || n > available(from)) return msg(`Введите число от 1 до ${available(from)}.`);
      sendChallenge(from, target, ll, n);
    }
  });
}

function sendChallenge(from, target, ll, n) {
  const tg = groups[target];
  if (!tg.leader) {
    captureSector(ll.lat, ll.lng, from);
    saveAll(); refreshMap();
    return msg(`У «${gname(target)}» нет главаря. «${gname(from)}» забирает точку.`);
  }
  tg.challenges.push({ id: rnd(), from, lat: ll.lat, lng: ll.lng, attackers: n });
  saveAll();
  msg(`Вызов отправлен лидеру «${gname(target)}». Ждём ответа.`);
}

function showDefend(gid, chId) {
  const ch = groups[gid].challenges.find(c => c.id === chId);
  if (!ch) return msg('Вызов уже неактуален.');
  const avail = available(gid);
  openModal(`
    <h2>Вызов</h2>
    <p>«${esc(gname(ch.from))}» атакует точку на вашей территории. Атакующих: ${ch.attackers}.</p>
    <p>Доступно у вас: ${avail}</p>
    <input type="number" id="defN" min="0" max="${avail}" value="${avail}">
    <button class="btn" data-act="go">Защищать</button>
    <button class="btn secondary" data-act="close">Закрыть</button>
  `, {
    go: () => {
      const n = parseInt($('defN').value, 10);
      if (!(n >= 0) || n > available(gid)) return msg('Неверное число людей.');
      respondChallenge(gid, chId, n);
    }
  });
}

function respondChallenge(gid, chId, d) {
  const g = groups[gid];
  const ch = g.challenges.find(c => c.id === chId);
  if (!ch) return msg('Вызов уже неактуален.');
  g.challenges = g.challenges.filter(c => c.id !== chId);
  const a = ch.attackers;
  const sq = ch.squadId ? squads.find(s => s.id === ch.squadId) : null;
  let text;

  if (a > d) {
    captureSector(ch.lat, ch.lng, ch.from);
    if (d > 0) sendToHospital(gid, d);
    text = `«${gname(ch.from)}» захватил точку. Защитники (${d}) в больнице на 30 сек.`;
    if (sq) { sq.state = 'idle'; sq.lat = ch.lat; sq.lng = ch.lng; }
  } else {
    if (sq) {
      if (sq.kind === 'merc') {
        const m = groups[sq.gid].mercs;
        m.splice(0, Math.min(a, m.length));
      } else {
        sendToHospital(sq.gid, a);
      }
      squads = squads.filter(s => s !== sq);
    } else {
      sendToHospital(ch.from, a);
    }
    text = `«${gname(gid)}» отбил атаку. Атакующие (${a}) в больнице на 30 сек.`;
  }

  saveAll(); refreshMap();
  playBattle(ch.lat, ch.lng, a, d);
  setTimeout(() => msg(text), 1500);
}

// ================= ДИПЛОМАТИЯ =================
let treatyDraft = null;

function showDiplo(gid) {
  openModal(`
    <h2>Дипломатия</h2>
    <button class="btn" data-act="peace">Мир</button>
    <button class="btn secondary" data-act="back">Назад</button>
  `, {
    peace: () => showPeaceMenu(gid),
    back: () => showOwnGroup(gid)
  });
}

function showPeaceMenu(gid) {
  openModal(`
    <h2>Мир</h2>
    <button class="btn" data-act="simple">Объявить мир</button>
    <button class="btn" data-act="treaty">Мир с договором</button>
    <button class="btn secondary" data-act="back">Назад</button>
  `, {
    simple: () => showSimplePeace(gid),
    treaty: () => { treatyDraft = { gid, target: null, type: 'money', money: '', sid: null }; showTreatyForm(gid); },
    back: () => showDiplo(gid)
  });
}

function showSimplePeace(gid) {
  const g = groups[gid];
  if (!g.enemies.length) return msg('Вы ни с кем не воюете.');
  let h = '<h2>Объявить мир</h2><p>С кем заключить мир:</p>';
  const acts = {};
  g.enemies.forEach((eid, i) => {
    h += `<button class="btn" data-act="p${i}">Мир с: ${esc(gname(eid))}</button>`;
    acts['p' + i] = () => { endWar(gid, eid); saveAll(); msg(`Мир с «${gname(eid)}» объявлен.`); };
  });
  h += `<button class="btn secondary" data-act="back">Назад</button>`;
  acts.back = () => showPeaceMenu(gid);
  openModal(h, acts);
}

function readTreaty() {
  const sel = $('trTarget'), m = $('trMoney');
  if (sel) treatyDraft.target = sel.value || null;
  if (m) treatyDraft.money = m.value;
}

function showTreatyForm(gid) {
  const d = treatyDraft;
  const opts = DEFS.filter(x => x.id !== gid)
    .map(x => `<option value="${x.id}" ${d.target === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const sector = d.sid ? sectors.find(s => s.id === d.sid) : null;
  let h = `
    <h2>Мир с договором</h2>
    <p>Группировка:</p>
    <select id="trTarget"><option value="">— выберите —</option>${opts}</select>
    <p>Что вы даёте в обмен:</p>
    <button class="btn ${d.type === 'money' ? '' : 'secondary'}" data-act="tmoney">Деньги</button>
    <button class="btn ${d.type === 'terr' ? '' : 'secondary'}" data-act="tterr">Территорию</button>`;
  if (d.type === 'money') {
    h += `<input type="number" id="trMoney" min="1" placeholder="Сумма, руб" value="${esc(d.money)}">`;
  } else {
    h += `<p>${sector ? 'Точка выбрана на карте.' : 'Точка не выбрана.'}</p>
      <button class="btn secondary" data-act="tpick">Выбрать точку на карте</button>`;
  }
  h += `
    <button class="btn" data-act="tsend">Отправить письмо</button>
    <button class="btn secondary" data-act="back">Назад</button>`;
  openModal(h, {
    tmoney: () => { readTreaty(); d.type = 'money'; showTreatyForm(gid); },
    tterr: () => { readTreaty(); d.type = 'terr'; showTreatyForm(gid); },
    tpick: () => { readTreaty(); startMode('tpick', gid, 'Нажмите свою захваченную точку, которую хотите отдать.'); },
    tsend: () => { readTreaty(); sendTreaty(gid); },
    back: () => showPeaceMenu(gid)
  });
}

function sendTreaty(gid) {
  const d = treatyDraft;
  if (!d || !d.target) return msg('Выберите группировку.');
  const g = groups[gid], tg = groups[d.target];
  if (!g.enemies.includes(d.target)) return msg(`Вы не воюете с «${gname(d.target)}». Договор возможен только во время войны.`);
  if (!tg.leader) return msg(`У «${gname(d.target)}» нет лидера. Письмо не отправлено, война продолжается.`);

  let offer;
  if (d.type === 'money') {
    const amt = parseInt(d.money, 10);
    if (!(amt >= 1)) return msg('Введите сумму больше 0.');
    if (me().money < amt) return msg(`Не хватает денег. У вас ${me().money} руб.`);
    offer = { type: 'money', amount: amt };
  } else {
    if (!d.sid) return msg('Выберите свою точку на карте.');
    const s = sectors.find(x => x.id === d.sid);
    if (!s || s.owner !== gid) return msg('Эта точка уже не ваша. Выберите другую.');
    offer = { type: 'sector', sid: d.sid };
  }
  tg.letters.push({ id: rnd(), from: gid, fromEmail: currentEmail, offer });
  saveAll();
  treatyDraft = null;
  msg(`Письмо отправлено лидеру «${gname(d.target)}». Ждём ответа.`);
}

function showLetters(gid) {
  const g = groups[gid];
  if (!g.letters.length) return msg('Писем нет.');
  let h = '<h2>Письма о мире</h2>';
  const acts = {};
  g.letters.forEach((l, i) => {
    const off = l.offer.type === 'money' ? `${l.offer.amount} руб` : 'свою захваченную точку';
    h += `<div class="inv">
      <p>От «${esc(gname(l.from))}»: в обмен на мир предлагают ${off}.</p>
      <button class="btn" data-act="la${i}">Принять</button>
      <button class="btn secondary" data-act="ld${i}">Отклонить</button>
    </div>`;
    acts['la' + i] = () => acceptLetter(gid, i);
    acts['ld' + i] = () => declineLetter(gid, i);
  });
  h += `<button class="btn secondary" data-act="close">Закрыть</button>`;
  openModal(h, acts);
}

function acceptLetter(gid, i) {
  const g = groups[gid];
  const l = g.letters[i];
  if (!l) return;
  g.letters.splice(i, 1);
  if (!groups[l.from].enemies.includes(gid)) { saveAll(); return msg('Война уже закончилась.'); }

  let extra;
  if (l.offer.type === 'money') {
    const sender = users[l.fromEmail];
    if (!sender || sender.money < l.offer.amount) {
      saveAll();
      return msg('У отправителя не хватает денег. Договор не заключён, война продолжается.');
    }
    sender.money -= l.offer.amount;
    me().money += l.offer.amount;
    extra = `Получено ${l.offer.amount} руб.`;
  } else {
    const s = sectors.find(x => x.id === l.offer.sid);
    if (s && s.owner === l.from) {
      s.owner = gid;
      extra = 'Точка передана вам.';
    } else {
      extra = 'Точка уже не принадлежала отправителю, передачи не было.';
    }
  }
  endWar(gid, l.from);
  saveAll(); renderMenu(); refreshMap();
  msg(`Мир с «${gname(l.from)}» заключён. ${extra}`);
}

function declineLetter(gid, i) {
  groups[gid].letters.splice(i, 1);
  saveAll(); renderMenu();
  msg('Письмо отклонено. Война продолжается.');
}

// ================= АДМИНКА =================
$('btnAdmin').onclick = () => {
  openModal(`
    <h2>Админка</h2>
    <input type="password" id="admPass" placeholder="Пароль">
    <button class="btn" data-act="enter">Войти</button>
    <button class="btn secondary" data-act="close">Закрыть</button>
  `, {
    enter: () => {
      if ($('admPass').value !== ADMIN_PASS) return msg('Неверный пароль.');
      showAdminPanel();
    }
  });
};

function showAdminPanel() {
  const opts = DEFS.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  openModal(`
    <h2>Админка</h2>
    <p>Группировка:</p>
    <select id="admG">${opts}</select>
    <p>Бойцов (шт.):</p>
    <input type="number" id="admMen" min="1" placeholder="Сколько бойцов выдать">
    <button class="btn" data-act="men">Выдать бойцов</button>
    <p>Деньги в казну (руб.):</p>
    <input type="number" id="admMoney" min="1" placeholder="Сумма">
    <button class="btn" data-act="money">Выдать деньги</button>
    <hr style="border-color:#333;margin:14px 0">
    <button class="btn" data-act="reset" style="background:#b71c1c">Сбросить всю карту и аккаунты</button>
    <button class="btn secondary" data-act="close">Закрыть</button>
  `, {
    men: () => {
      const gid = $('admG').value, n = parseInt($('admMen').value, 10);
      if (!(n >= 1)) return msg('Введите число больше 0.');
      groups[gid].bonusMen += n;
      saveAll();
      msg(`Выдано ${n} бойцов группировке «${gname(gid)}».`);
    },
    money: () => {
      const gid = $('admG').value, n = parseInt($('admMoney').value, 10);
      if (!(n >= 1)) return msg('Введите сумму больше 0.');
      groups[gid].money += n;
      saveAll();
      msg(`В казну «${gname(gid)}» выдано ${n} руб.`);
    },
    reset: () => {
      openModal(`
        <h2>Точно сбросить?</h2>
        <p>Удалятся все аккаунты, группировки, территории, постройки, отряды и захваченные точки. Это нельзя отменить.</p>
        <button class="btn" style="background:#b71c1c" data-act="doReset">Да, сбросить всё</button>
        <button class="btn secondary" data-act="close">Отмена</button>
      `, {
        doReset: resetEverything
      });
    }
  });
}

function resetEverything() {
  users = {};
  sectors = [];
  squads = [];
  groups = {};
  DEFS.forEach(d => {
    groups[d.id] = {
      leader: null, members: [], enemies: [], challenges: [], mercs: [], letters: [],
      zone: null, buildings: [], money: 0, bonusMen: 0
    };
  });
  currentEmail = null;
  [K_USERS, K_SESSION, K_GROUPS, K_SECTORS, K_SQUADS].forEach(k => localStorage.removeItem(k));
  saveAll();
  cancelMode();
  closeModal();
  refreshMap();
  showScreen('auth');
  msg('Всё сброшено. Карта и аккаунты очищены.');
}

// ================= РЕЖИМЫ НА КАРТЕ =================
let map = null, zoneLayer, sectorLayer, battleLayer, draftLayer, squadLayer, buildLayer;
let mode = null, modeGid = null, modeSquad = null, modeBuild = null, drawPts = [];

function showHint(text, { undo = false, done = false } = {}) {
  $('hintText').textContent = text;
  $('hintUndo').classList.toggle('hidden', !undo);
  $('hintDone').classList.toggle('hidden', !done);
  $('hint').classList.add('active');
}

function cancelMode() {
  mode = null; modeGid = null; modeSquad = null; modeBuild = null; drawPts = [];
  if (draftLayer) draftLayer.clearLayers();
  $('hint').classList.remove('active');
  if (map) map.getContainer().style.cursor = '';
}

function startMode(kind, gid, text, opts = {}, extra = null) {
  closeModal();
  cancelMode();
  mode = kind; modeGid = gid; drawPts = [];
  if (kind === 'dest') modeSquad = extra;
  if (kind === 'build') modeBuild = opts.type;
  showScreen('game');
  initMap();
  showHint(text, opts);
  map.getContainer().style.cursor = 'crosshair';
  renderDraft();
  updateSideBtn();
}

function renderDraft() {
  if (!draftLayer) return;
  draftLayer.clearLayers();
  const col = modeGid ? gcolor(modeGid) : '#fff';
  if (drawPts.length >= 2) L.polyline(drawPts, { color: col, weight: 2, dashArray: '4 4' }).addTo(draftLayer);
  drawPts.forEach(p => L.circleMarker(p, { radius: 4, color: '#fff', fillColor: col, fillOpacity: 1, weight: 1 }).addTo(draftLayer));
}

function finishDraw() {
  if (drawPts.length < 3) return msg('Нужно минимум 3 точки.');
  const gid = modeGid;
  groups[gid].zone = drawPts.slice();
  saveAll();
  cancelMode();
  refreshMap();
  msg(`Территория «${gname(gid)}» сохранена.`);
}

function handleTreatyPick(gid, ll) {
  const s = [...sectors].reverse().find(x => x.owner === gid && distM(ll.lat, ll.lng, x.lat, x.lng) <= SECTOR_R);
  if (!s) return msg('Здесь нет вашей захваченной точки. Нажмите на свою точку.');
  treatyDraft.sid = s.id;
  cancelMode();
  showTreatyForm(gid);
}

$('hintCancel').onclick = cancelMode;
$('hintDone').onclick = finishDraw;
$('hintUndo').onclick = () => { drawPts.pop(); renderDraft(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelMode(); });

// ================= КАРТА =================
function initMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 100); return; }
  map = L.map('map', { doubleClickZoom: false }).setView([55.8325, 37.9710], 16);
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics' }
  ).addTo(map);
  zoneLayer = L.layerGroup().addTo(map);
  sectorLayer = L.layerGroup().addTo(map);
  battleLayer = L.layerGroup().addTo(map);
  buildLayer = L.layerGroup().addTo(map);
  squadLayer = L.layerGroup().addTo(map);
  draftLayer = L.layerGroup().addTo(map);

  map.on('click', e => {
    if (mode === 'draw') {
      drawPts.push([e.latlng.lat, e.latlng.lng]);
      renderDraft();
    } else if (mode === 'attack') {
      const gid = modeGid;
      cancelMode();
      handleAttackPoint(gid, e.latlng);
    } else if (mode === 'tpick') {
      handleTreatyPick(modeGid, e.latlng);
    } else if (mode === 'dest') {
      const sid = modeSquad;
      cancelMode();
      moveSquad(sid, e.latlng.lat, e.latlng.lng);
    } else if (mode === 'build') {
      const gid = modeGid, type = modeBuild;
      cancelMode();
      placeBuilding(gid, type, e.latlng);
    }
  });

  refreshMap();
  setTimeout(() => map.invalidateSize(), 100);
}

function refreshMap() {
  if (!map) return;
  zoneLayer.clearLayers();
  DEFS.forEach(d => {
    const z = groups[d.id].zone;
    if (!z) return;
    L.polygon(z, { color: d.color, weight: 2, fillColor: d.color, fillOpacity: 0.85 })
      .addTo(zoneLayer)
      .bindTooltip(() => groupTip(d.id), { sticky: true })
      .on('dblclick', () => onGroupDblClick(d.id));
  });
  sectorLayer.clearLayers();
  sectors.forEach(s => {
    L.circle([s.lat, s.lng], { radius: SECTOR_R, color: gcolor(s.owner), fillColor: gcolor(s.owner), fillOpacity: 0.8, weight: 2 })
      .addTo(sectorLayer)
      .bindTooltip(() => sectorTip(s), { sticky: true })
      .on('dblclick', () => onGroupDblClick(s.owner));
  });
  refreshBuildings();
  refreshSquads();
}

function refreshBuildings() {
  if (!buildLayer) return;
  buildLayer.clearLayers();
  DEFS.forEach(d => {
    groups[d.id].buildings.forEach(bl => {
      const def = BUILD[bl.type];
      const icon = L.divIcon({
        className: '',
        html: `<div class="bld" style="background:${def.color}">${def.icon}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13]
      });
      L.marker([bl.lat, bl.lng], { icon })
        .addTo(buildLayer)
        .bindTooltip(`<b>${def.name}</b><br>${esc(gname(d.id))}`, { sticky: true })
        .on('click', () => {
          if (isLeaderOf(d.id) && bl.type === 'market') msg('Покупки: скоро');
        });
    });
  });
}

function refreshSquads() {
  if (!squadLayer) return;
  squadLayer.clearLayers();
  const now = Date.now();
  squads.forEach(s => {
    const p = squadPos(s, now);
    const icon = L.divIcon({
      className: '',
      html: `<div class="sq ${s.kind === 'merc' ? 'merc' : ''}" style="background:${gcolor(s.gid)}">${s.count}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
    L.marker([p.lat, p.lng], { icon })
      .addTo(squadLayer)
      .bindTooltip(
        `<b>${esc(s.name)}</b><br>${s.kind === 'merc' ? 'наёмники' : 'пацаны'}: ${s.count}<br>${esc(gname(s.gid))}, ${SQ_STATE[s.state]}`,
        { sticky: true }
      )
      .on('click', () => { if (isLeaderOf(s.gid)) openSquadMenu(s.id); });
  });
}

function playBattle(lat, lng, a, d) {
  if (!battleLayer) return;
  battleLayer.clearLayers();
  const sp = 0.00004;
  const icon = c => L.divIcon({ className: '', html: `<div class="man ${c}"></div>`, iconSize: [8, 14], iconAnchor: [4, 7] });
  const sa = Math.min(a, 30), sd = Math.min(d, 30);
  for (let i = 0; i < sa; i++) {
    L.marker([lat + (i - (sa - 1) / 2) * sp, lng - 0.0002], { icon: icon('att'), interactive: false }).addTo(battleLayer);
  }
  for (let i = 0; i < sd; i++) {
    L.marker([lat + (i - (sd - 1) / 2) * sp, lng + 0.0002], { icon: icon('def'), interactive: false }).addTo(battleLayer);
  }
  setTimeout(() => battleLayer.clearLayers(), 6000);
}

// ================= СТАРТ =================
(function init() {
  saveAll();
  const session = localStorage.getItem(K_SESSION);
  if (session && users[session]) {
    currentEmail = session;
    applyIncome();
    renderMenu();
    showScreen('menu');
  } else {
    showScreen('auth');
  }
})();
</script>

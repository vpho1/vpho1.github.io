<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раен Балашиха</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #eee;
    min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ---------- AUTH ---------- */
  #auth { align-items: center; justify-content: center; }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 28px;
    width: 90%;
    max-width: 360px;
  }
  .card h1 { text-align: center; margin-bottom: 20px; color: #e53935; letter-spacing: 1px; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid #333; }
  .tabs button {
    flex: 1; padding: 10px; background: none; border: none;
    color: #888; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs button.active { color: #fff; border-bottom-color: #e53935; }
  form { display: none; flex-direction: column; }
  form.active { display: flex; }
  input {
    padding: 11px; margin-bottom: 10px; background: #111;
    border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px;
  }
  input:focus { outline: none; border-color: #e53935; }
  .error { color: #ff5252; font-size: 14px; min-height: 18px; margin-bottom: 8px; text-align: center; }
  .btn {
    padding: 12px; background: #e53935; border: none; color: #fff;
    border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%;
  }
  .btn:hover { background: #c62828; }

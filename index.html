<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раен Балашиха</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d0d0d; color: #eee; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* AUTH */
  #auth { align-items: center; justify-content: center; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 90%; max-width: 360px; }
  .card h1 { text-align: center; margin-bottom: 20px; color: #e53935; letter-spacing: 1px; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid #333; }
  .tabs button { flex: 1; padding: 10px; background: none; border: none; color: #888; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #fff; border-bottom-color: #e53935; }
  form { display: none; flex-direction: column; }
  form.active { display: flex; }
  input, select { padding: 11px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; }
  input:focus, select:focus { outline: none; border-color: #e53935; }
  .error { color: #ff5252; font-size: 14px; min-height: 18px; margin-bottom: 8px; text-align: center; }
  .btn { padding: 12px; background: #e53935; border: none; color: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .btn:hover { background: #c62828; }
  .btn.secondary { background: #333; }
  .btn.secondary:hover { background: #444; }

  /* MENU */
  #menu { align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 20px; }
  #menu h1 { font-size: 40px; color: #e53935; letter-spacing: 2px; }
  #menu p { color: #aaa; text-align: center; }
  #menu .menu-btns { width: 90%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }
  #invites { width: 90%; max-width: 300px; }

  /* GAME */
  #game { flex-direction: column; height: 100vh; position: relative; }
  .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #1a1a1a; border-bottom: 1px solid #333; }
  .topbar span { font-weight: bold; color: #e53935; }
  .topbar .btn { width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
  #map { flex: 1; width: 100%; }
  #hint { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #e53935; color: #fff; padding: 10px 12px; border-radius: 8px; z-index: 500; display: none; font-size: 14px; text-align: center; min-width: 260px; }
  #hint.active { display: block; }
  #hint .hint-btns { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
  #hint .hint-btns button { padding: 8px 12px; border: none; border-radius: 6px; color: #fff; background: #e53935; cursor: pointer; font-size: 14px; }
  #hint .hint-btns button.secondary { background: #333; }
  #hint .hidden { display: none; }
  .leaflet-tooltip { background: #1a1a1a; color: #fff; border: 1px solid #444; font-size: 13px; }

  /* BATTLE PEOPLE */
  .man { position: relative; width: 8px; height: 14px; }
  .man::before { content: ''; position: absolute; top: 0; left: 2px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .man::after { content: ''; position: absolute; top: 5px; left: 0; width: 8px; height: 9px; border-radius: 2px; background: currentColor; }
  .man.att { color: #ffeb3b; animation: marchR 0.6s ease-in-out infinite alternate; }
  .man.def { color: #4fc3f7; animation: marchL 0.6s ease-in-out infinite alternate; }
  @keyframes marchR { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  @keyframes marchL { from { transform: translateX(2px); } to { transform: translateX(-3px); } }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-bg.active { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 22px; width: 90%; max-width: 360px; max-height: 90vh; overflow-y: auto; color: #eee; }
  .modal h2 { color: #e53935; margin-bottom: 12px; font-size: 20px; }
  .modal p { margin-bottom: 8px; line-height: 1.4; }
  .modal input, .modal select { width: 100%; }
  .inv { background: #222; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .inv p { margin-bottom: 8px; font-size: 14px; }
  .inv .btn { width: auto; display: inline-block; padding: 8px 12px; font-size: 14px; margin-right: 6px; }
</style>
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="auth" class="screen active">
  <div class="card">
    <h1>РАЕН БАЛАШИХА</h1>
    <div class="tabs">
      <button id="tabLogin" class="active">Вход</button>
      <button id="tabRegister">Регистрация</button>
    </div>
    <form id="loginForm" class="active">
      <input type="email" id="loginEmail" placeholder="Почта" required>
      <input type="password" id="loginPass" placeholder="Пароль" required>
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn">Войти</button>
    </form>
    <form id="registerForm">
      <input type="text" id="regNick" placeholder="Никнейм" required>
      <input type="text" id="regCallsign" placeholder="Позывной" required>
      <input type="email" id="regEmail" placeholder="Почта" required>
      <input type="password" id="regPass" placeholder="Пароль (минимум 6 символов)" required>
      <div class="error" id="regError"></div>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
  </div>
</div>

<!-- МЕНЮ -->
<div id="menu" class="screen">
  <h1>РАЕН</h1>
  <p id="welcome"></p>
  <p id="money"></p>
  <div id="invites"></div>
  <div class="menu-btns">
    <button class="btn" id="btnPlay">Начать игру</button>
    <button class="btn secondary" id="btnGroups">Группировки</button>
    <button class="btn secondary" id="btnLogout">Выйти</button>
  </div>
</div>

<!-- ИГРА -->
<div id="game" class="screen">
  <div class="topbar">
    <span>Балашиха</span>
    <button class="btn secondary" id="btnBack">← В меню</button>
  </div>
  <div id="map"></div>
  <div id="hint">
    <div id="hintText"></div>
    <div class="hint-btns">
      <button id="hintUndo" class="hidden">Убрать точку</button>
      <button id="hintDone" class="hidden">Готово</button>
      <button id="hintCancel" class="secondary">Отмена</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modalBg" class="modal-bg">
  <div class="modal" id="modalBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ================= НАСТРОЙКИ =================
const MAX_MEMBERS = 30;
const MERC_PRICE = 100;
const MERC_TIME = 10 * 60 * 1000;
const HOSPITAL_TIME = 30 * 1000;
const START_MONEY = 1000;
const SECTOR_R = 35;

const GROUP_DEFS = [
  { id: 'univ', name: 'Универсам', color: '#2e7d32' },
  { id: 'kino', name: 'Кинопленка', color: '#7b1fa2' },
  { id: 'chainiki', name: 'Чайники', color: '#757575' }
];

// ================= ХРАНИЛИЩЕ =================
const USERS_KEY = 'raen_users';
const SESSION_KEY = 'raen_session';
const GROUPS_KEY = 'raen_groups';
const SECTORS_KEY = 'raen_sectors';

function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function setUser(email, data) {
  const u = getUsers();
  u[email] = { ...u[email], ...data };
  saveUsers(u);
}
function me() { return getUsers()[currentEmail]; }

function loadGroups() {
  const saved = JSON.parse(localStorage.getItem(GROUPS_KEY) || '{}');
  GROUP_DEFS.forEach(d => {
    const g = saved[d.id] || {};
    saved[d.id] = {
      leader: g.leader || null,
      members: g.members || [],
      enemies: g.enemies || [],
      challenges: g.challenges || [],
      mercs: g.mercs || [],
      letters: g.letters || [],   // письма о мире, приходят лидеру
      zone: g.zone || null
    };
  });
  return saved;
}
let groups = loadGroups();
let sectors = JSON.parse(localStorage.getItem(SECTORS_KEY) || '[]');
function saveGroups() { localStorage.setItem(GROUPS_KEY, JSON.stringify(groups)); }
function saveSectors() { localStorage.setItem(SECTORS_KEY, JSON.stringify(sectors)); }

async function hashPass(text) {
  if (!window.crypto || !crypto.subtle) return text;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// ================= ПОМОЩНИКИ =================
let currentEmail = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = () => Math.random().toString(36).slice(2, 9);
const gdef = id => GROUP_DEFS.find(d => d.id === id);
const groupName = id => id ? gdef(id).name : '';
const colorOf = id => gdef(id).color;
function displayName(email) {
  const u = getUsers()[email];
  return u ? `${u.nick} (${u.callsign})` : '—';
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function inHospital(email) {
  const u = getUsers()[email];
  return !!u && (u.hospitalUntil || 0) > Date.now();
}
function activeMercs(gid) {
  const g = groups[gid];
  g.mercs = g.mercs.filter(m => m.exp > Date.now());
  return g.mercs.length;
}
function available(gid) {
  const g = groups[gid];
  return g.members.filter(e => !inHospital(e)).length + activeMercs(gid);
}
function sendToHospital(gid, count) {
  const g = groups[gid];
  const until = Date.now() + HOSPITAL_TIME;
  let left = count;
  for (const e of g.members) {
    if (left <= 0) break;
    if (inHospital(e)) continue;
    setUser(e, { hospitalUntil: until });
    left--;
  }
  activeMercs(gid);
  const k = Math.min(left, g.mercs.length);
  g.mercs.splice(0, k);
}
function endWar(a, b) {
  groups[a].enemies = groups[a].enemies.filter(x => x !== b);
  groups[b].enemies = groups[b].enemies.filter(x => x !== a);
  groups[a].challenges = groups[a].challenges.filter(c => c.from !== b);
  groups[b].challenges = groups[b].challenges.filter(c => c.from !== a);
  saveGroups();
}

// ================= ЭКРАНЫ =================
const screens = {
  auth: document.getElementById('auth'),
  menu: document.getElementById('menu'),
  game: document.getElementById('game')
};
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// ================= ВКЛАДКИ =================
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
tabLogin.onclick = () => {
  tabLogin.classList.add('active'); tabRegister.classList.remove('active');
  loginForm.classList.add('active'); registerForm.classList.remove('active');
};
tabRegister.onclick = () => {
  tabRegister.classList.add('active'); tabLogin.classList.remove('active');
  registerForm.classList.add('active'); loginForm.classList.remove('active');
};

// ================= РЕГИСТРАЦИЯ / ВХОД =================
registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('regError');
  err.textContent = '';
  const nick = document.getElementById('regNick').value.trim();
  const callsign = document.getElementById('regCallsign').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  if (!nick || !callsign || !email || !pass) { err.textContent = 'Заполните все поля'; return; }
  if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
  const users = getUsers();
  if (users[email]) { err.textContent = 'Такая почта уже зарегистрирована'; return; }
  users[email] = {
    nick, callsign, pass: await hashPass(pass),
    group: null, role: null, money: START_MONEY, invites: [], hospitalUntil: 0
  };
  saveUsers(users);
  localStorage.setItem(SESSION_KEY, email);
  registerForm.reset();
  openMenu(email);
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginError');
  err.textContent = '';
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const user = getUsers()[email];
  if (!user) { err.textContent = 'Пользователь не найден'; return; }
  if (user.pass !== await hashPass(pass)) { err.textContent = 'Неверный пароль'; return; }
  localStorage.setItem(SESSION_KEY, email);
  loginForm.reset();
  openMenu(email);
});

// ================= МЕНЮ =================
function openMenu(email) {
  currentEmail = email;
  const u = getUsers()[email];
  if (u.money === undefined) setUser(email, { money: START_MONEY });
  if (!u.invites) setUser(email, { invites: [] });
  renderMenu();
  showScreen('menu');
}

function renderMenu() {
  const u = me();
  const g = u.group ? ` | группировка: ${groupName(u.group)} (${u.role === 'leader' ? 'главный' : 'шпана'})` : '';
  document.getElementById('welcome').textContent = `Привет, ${u.nick} (${u.callsign})${g}`;
  const hosp = inHospital(currentEmail) ? ` | в больнице до ${fmtTime(u.hospitalUntil)}` : '';
  document.getElementById('money').textContent = `Деньги: ${u.money} руб${hosp}`;
  renderInvites();
}

function renderInvites() {
  const u = me();
  let h = '';
  (u.invites || []).forEach((inv, i) => {
    h += `<div class="inv">
      <p>Приглашение в «${esc(groupName(inv.gid))}» от ${esc(inv.from)}</p>
      <button class="btn" data-inv="acc:${i}">Принять</button>
      <button class="btn secondary" data-inv="dec:${i}">Нет</button>
    </div>`;
  });
  if (u.group && u.role === 'leader') {
    const gr = groups[u.group];
    if (gr.challenges.length) {
      h += `<div class="inv">
        <p>Вызовов на бой: ${gr.challenges.length}</p>
        <button class="btn" data-inv="chal">Открыть вызовы</button>
      </div>`;
    }
    if (gr.letters.length) {
      h += `<div class="inv">
        <p>Писем о мире: ${gr.letters.length}</p>
        <button class="btn" data-inv="let">Открыть письма</button>
      </div>`;
    }
  }
  document.getElementById('invites').innerHTML = h;
}

document.getElementById('invites').addEventListener('click', e => {
  const a = e.target.dataset.inv;
  if (!a) return;
  const [act, idx] = a.split(':');
  if (act === 'acc') acceptInvite(+idx);
  else if (act === 'dec') declineInvite(+idx);
  else if (act === 'chal') showOwnGroup(me().group);
  else if (act === 'let') showLetters(me().group);
});

function acceptInvite(i) {
  const u = me();
  const inv = u.invites[i];
  const invites = u.invites.filter((_, k) => k !== i);
  if (u.group) { setUser(currentEmail, { invites }); return msg('Вы уже в группировке.'); }
  const g = groups[inv.gid];
  if (!g || g.members.length >= MAX_MEMBERS) {
    setUser(currentEmail, { invites });
    return msg('Группировка недоступна или нет мест.');
  }
  g.members.push(currentEmail);
  saveGroups();
  setUser(currentEmail, { group: inv.gid, role: 'member', invites });
  renderMenu();
}
function declineInvite(i) {
  setUser(currentEmail, { invites: me().invites.filter((_, k) => k !== i) });
  renderMenu();
}

document.getElementById('btnLogout').onclick = () => {
  localStorage.removeItem(SESSION_KEY);
  currentEmail = null;
  showScreen('auth');
};

// ================= МОДАЛКА =================
const modalBg = document.getElementById('modalBg');
const modalBody = document.getElementById('modalBody');
let modalActs = {};
modalBody.addEventListener('click', e => {
  const a = e.target.dataset.act;
  if (a && modalActs[a]) modalActs[a]();
});
function openModal(html, acts = {}) {
  modalActs = { close: closeModal, ...acts };
  modalBody.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal() { modalBg.classList.remove('active'); }
function msg(text) {
  openModal(`<p>${esc(text)}</p><button class="btn" data-act="close">OK</button>`);
}

// ================= СПИСОК ГРУППИРОВОК =================
document.getElementById('btnGroups').onclick = showGroupList;
function showGroupList() {
  let html = '<h2>Группировки</h2>';
  const acts = {};
  GROUP_DEFS.forEach((d, i) => {
    const g = groups[d.id];
    html += `<div class="inv">
      <p><b>${esc(d.name)}</b>: лидер ${g.leader ? esc(displayName(g.leader)) : 'нет'}, людей ${g.members.length} / ${MAX_MEMBERS}${g.zone ? '' : ', территории нет'}</p>
      <button class="btn" data-act="j${i}">Открыть</button>
    </div>`;
    acts[`j${i}`] = () => onGroupDblClick(d.id);
  });
  html += `<button class="btn secondary" data-act="close">Закрыть</button>`;
  openModal(html, acts);
}

// ================= ТУЛТИПЫ И КЛИКИ =================
function tooltipHtml(gid) {
  const g = groups[gid];
  const leader = g.leader ? esc(displayName(g.leader)) : 'нет';
  const enemies = g.enemies.length ? g.enemies.map(id => esc(groupName(id))).join(', ') : 'ни с кем';
  return `<b>${esc(groupName(gid))}</b><br>Лидер: ${leader}<br>Воюет с: ${enemies}`;
}
function sectorTooltip(s) {
  const g = groups[s.owner];
  const leader = g.leader ? esc(displayName(g.leader)) : 'нет';
  return `<b>${esc(groupName(s.owner))}</b> (захвачено)<br>Лидер: ${leader}`;
}

function onGroupDblClick(gid) {
  const user = me();
  if (!user) return;
  if (user.group === gid) return showOwnGroup(gid);
  if (user.group) return msg(`Вы уже в группировке «${groupName(user.group)}». Сначала выйдите из неё.`);
  showJoinMenu(gid);
}

function showJoinMenu(gid) {
  const g = groups[gid];
  if (g.members.length >= MAX_MEMBERS) return msg('В группировке нет мест.');
  openModal(`
    <h2>${esc(groupName(gid))}</h2>
    <p>Вступить как:</p>
    <button class="btn" data-act="leader">Главный${g.leader ? ' (занят)' : ''}</button>
    <button class="btn secondary" data-act="member">Шпана</button>
    <button class="btn secondary" data-act="close">Отмена</button>
  `, {
    leader: () => joinGroup(gid, 'leader'),
    member: () => joinGroup(gid, 'member')
  });
}

function joinGroup(gid, role) {
  const g = groups[gid];
  if (g.members.length >= MAX_MEMBERS) return msg('В группировке нет мест (максимум 30).');
  if (role === 'leader') {
    if (g.leader) return msg(`Главный уже есть: ${displayName(g.leader)}. Вступите как шпана.`);
    g.leader = currentEmail;
  }
  g.members.push(currentEmail);
  saveGroups();
  setUser(currentEmail, { group: gid, role });
  renderMenu();
  msg(`Вы вступили в «${groupName(gid)}» как ${role === 'leader' ? 'главный' : 'шпана'}.`);
}

// ================= ПАНЕЛЬ СВОЕЙ ГРУППИРОВКИ =================
function showOwnGroup(gid) {
  const user = me();
  if (!gid || user.group !== gid) return;
  const g = groups[gid];
  const isLeader = user.role === 'leader';
  const mercs = activeMercs(gid);
  const mercEnd = mercs ? ` (до ${fmtTime(Math.max(...g.mercs.map(m => m.exp)))})` : '';
  const enemies = g.enemies.length ? g.enemies.map(id => esc(groupName(id))).join(', ') : 'ни с кем';

  let html = `
    <h2>${esc(groupName(gid))}</h2>
    <p>Лидер: ${g.leader ? esc(displayName(g.leader)) : 'нет'}</p>
    <p>Людей: ${g.members.length} / ${MAX_MEMBERS}</p>
    <p>Наёмники: ${mercs}${mercEnd}</p>
    <p>Доступно в бой: ${available(gid)}</p>
    <p>Воюет с: ${enemies}</p>
    <p>Территория: ${g.zone ? 'нарисована' : 'не нарисована'}</p>
    <p>Вы: ${isLeader ? 'главный' : 'шпана'}</p>
  `;
  const acts = {};

  if (isLeader) {
    g.challenges.forEach(ch => {
      html += `<div class="inv">
        <p>Вызов от «${esc(groupName(ch.from))}»: атакующих ${ch.attackers}</p>
        <button class="btn" data-act="def:${ch.id}">Защищать</button>
      </div>`;
      acts[`def:${ch.id}`] = () => showDefend(gid, ch.id);
    });
    html += `
      <button class="btn" data-act="draw">${g.zone ? 'Нарисовать территорию заново' : 'Нарисовать территорию'}</button>
      <button class="btn" data-act="war">Война</button>
      <button class="btn" data-act="trade">Торговля</button>
      <button class="btn" data-act="diplo">Дипломатия</button>`;
    acts.draw = () => startDraw(gid);
    acts.war = () => showWarMenu(gid);
    acts.trade = () => msg('Торговля: скоро');
    acts.diplo = () => showDiplo(gid);
  } else {
    const label = g.leader ? `Стать лидером (сейчас: ${displayName(g.leader)})` : 'Стать главным';
    html += `<button class="btn secondary" data-act="takeover">${esc(label)}</button>`;
    acts.takeover = () => takeLeadership(gid);
  }

  html += `
    <button class="btn" data-act="call">Позвать чушпанов</button>
    <button class="btn" data-act="merc">Наёмники с Раена</button>
    <button class="btn secondary" data-act="leave">Выйти из группировки</button>`;
  acts.call = () => showInvite(gid);
  acts.merc = () => showMercs(gid);
  acts.leave = () => leaveGroup(gid);

  openModal(html, acts);
}

function takeLeadership(gid) {
  if (!confirm('Стать главным этой группировки?')) return;
  const g = groups[gid];
  if (g.leader) setUser(g.leader, { role: 'member' });
  g.leader = currentEmail;
  saveGroups();
  setUser(currentEmail, { role: 'leader' });
  renderMenu();
  showOwnGroup(gid);
}

function leaveGroup(gid) {
  const g = groups[gid];
  g.members = g.members.filter(e => e !== currentEmail);
  if (g.leader === currentEmail) g.leader = null;
  saveGroups();
  setUser(currentEmail, { group: null, role: null });
  renderMenu();
  msg(`Вы вышли из «${groupName(gid)}».`);
}

// ================= ПРИЗЫВ =================
function showInvite(gid) {
  openModal(`
    <h2>Позвать чушпанов</h2>
    <p>Введите ник игрока.</p>
    <input type="text" id="invNick" placeholder="Ник">
    <button class="btn" data-act="go">Позвать</button>
    <button class="btn secondary" data-act="back">Назад</button>
  `, {
    go: () => inviteByNick(gid, document.getElementById('invNick').value),
    back: () => showOwnGroup(gid)
  });
}

function inviteByNick(gid, nick) {
  const name = nick.trim().toLowerCase();
  if (!name) return msg('Введите ник.');
  const users = getUsers();
  const target = Object.keys(users).find(e => users[e].nick.toLowerCase() === name);
  if (!target) return msg('Игрок с таким ником не найден.');
  if (target === currentEmail) return msg('Себя звать не надо.');
  if (users[target].group) return msg('Он уже в группировке.');
  if (groups[gid].members.length >= MAX_MEMBERS) return msg('Нет мест.');
  setUser(target, { invites: [...(users[target].invites || []), { gid, from: displayName(currentEmail) }] });
  msg(`Приглашение отправлено: ${users[target].nick}.`);
}

// ================= НАЁМНИКИ =================
function showMercs(gid) {
  const u = me();
  openModal(`
    <h2>Наёмники с Раена</h2>
    <p>Цена: ${MERC_PRICE} руб за 1 наёмника. Служат 10 минут.</p>
    <p>У вас: ${u.money} руб</p>
    <input type="number" id="mercN" min="1" value="1">
    <button class="btn" data-act="buy">Нанять</button>
    <button class="btn secondary" data-act="back">Назад</button>
  `, {
    buy: () => buyMercs(gid),
    back: () => showOwnGroup(gid)
  });
}

function buyMercs(gid) {
  const n = parseInt(document.getElementById('mercN').value, 10);
  if (isNaN(n) || n < 1) return msg('Введите число больше 0.');
  const u = me();
  const cost = n * MERC_PRICE;
  if (u.money < cost) return msg(`Не хватает денег. Нужно ${cost} руб, у вас ${u.money} руб.`);
  const exp = Date.now() + MERC_TIME;
  for (let i = 0; i < n; i++) groups[gid].mercs.push({ exp });
  saveGroups();
  setUser(currentEmail, { money: u.money - cost });
  renderMenu();
  msg(`Нанято ${n} наёмн. Служат до ${fmtTime(exp)}.`);
}

function declareWar(a, b) {
  if (!groups[a].enemies.includes(b)) groups[a].enemies.push(b);
  if (!groups[b].enemies.includes(a)) groups[b].enemies.push(a);
  saveGroups();
}

function showWarMenu(gid) {
  const g = groups[gid];
  let html = `<h2>Война</h2>`;
  html += g.enemies.length
    ? `<p>Воюете с: ${g.enemies.map(id => esc(groupName(id))).join(', ')}</p>`

    acts[`w:${x.id}`] = () => { declareWar(gid, x.id); msg(`Война с «${x.name}» объявлена.`); };

// Анкета «Мир с договором»
function readTreatyDraft() {
  const sel = document.getElementById('trTarget');
  const money = document.getElementById('trMoney');
  if (sel) treatyDraft.target = sel.value || null;
  if (money) treatyDraft.money = money.value;
}

function showTreatyForm(gid) {
  if (!treatyDraft || treatyDraft.gid !== gid) treatyDraft = { gid, target: null, type: 'money', money: '', sid: null };
  const d = treatyDraft;
  const opts = GROUP_DEFS.filter(x => x.id !== gid)
    .map(x => `<option value="${x.id}" ${d.target === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const sector = d.sid ? sectors.find(s => s.id === d.sid) : null;

  let html = `
    <h2>Мир с договором</h2>
    <p>Группировка:</p>
    <select id="trTarget"><option value="">— выберите —</option>${opts}</select>
    <p>Что вы даёте в обмен:</p>
    <button class="btn ${d.type === 'money' ? '' : 'secondary'}" data-act="tmoney">Деньги</button>
    <button class="btn ${d.type === 'terr' ? '' : 'secondary'}" data-act="tterr">Территорию</button>`;

  if (d.type === 'money') {
    html += `<input type="number" id="trMoney" min="1" placeholder="Сумма, руб" value="${esc(d.money)}">`;
  } else {
    html += `<p>${sector ? 'Точка выбрана на карте.' : 'Точка не выбрана.'}</p>
      <button class="btn secondary" data-act="tpick">Выбрать точку на карте</button>`;
  }

  html += `
    <button class="btn" data-act="tsend">Отправить письмо</button>
    <button class="btn secondary" data-act="back">Назад</button>`;

  openModal(html, {
    tmoney: () => { readTreatyDraft(); d.type = 'money'; showTreatyForm(gid); },
    tterr: () => { readTreatyDraft(); d.type = 'terr'; showTreatyForm(gid); },
    tpick: () => { readTreatyDraft(); startTreatyPick(gid); },
    tsend: () => { readTreatyDraft(); sendTreaty(gid); },
    back: () => showPeaceMenu(gid)
  });
}

function sendTreaty(gid) {
  const d = treatyDraft;
  if (!d || d.gid !== gid) return;
  if (!d.target) return msg('Выберите группировку.');
  const g = groups[gid];
  const tg = groups[d.target];
  if (!g.enemies.includes(d.target)) {
    return msg(`Вы не воюете с «${groupName(d.target)}». Договор возможен только во время войны.`);
  }

  let offer;
  if (d.type === 'money') {
    const amt = parseInt(d.money, 10);
    if (isNaN(amt) || amt < 1) return msg('Введите сумму больше 0.');
    if (me().money < amt) return msg(`Не хватает денег. У вас ${me().money} руб.`);
    offer = { type: 'money', amount: amt };
  } else {
    if (!d.sid) return msg('Выберите свою точку на карте.');
    const s = sectors.find(x => x.id === d.sid);
    if (!s || s.owner !== gid) return msg('Эта точка уже не ваша. Выберите другую.');
    offer = { type: 'sector', sid: d.sid };
  }

  if (!tg.leader) {
    return msg(`У «${groupName(d.target)}» нет лидера. Письмо не отправлено, война продолжается.`);
  }

  tg.letters.push({ id: rnd(), from: gid, fromEmail: currentEmail, offer });
  saveGroups();
  treatyDraft = null;
  msg(`Письмо отправлено лидеру «${groupName(d.target)}». Ждём ответа.`);
}

// Письма о мире (для лидера получающей группировки)
function offerText(o) {
  if (o.type === 'money') return `${o.amount} руб`;
  return 'свою захваченную точку';
}

function showLetters(gid) {
  const g = groups[gid];
  if (!g.letters.length) return msg('Писем нет.');
  let html = '<h2>Письма о мире</h2>';
  const acts = {};
  g.letters.forEach((l, i) => {
    html += `<div class="inv">
      <p>От «${esc(groupName(l.from))}»: в обмен на мир предлагают ${offerText(l.offer)}.</p>
      <button class="btn" data-act="la${i}">Принять</button>
      <button class="btn secondary" data-act="ld${i}">Отклонить</button>
    </div>`;
    acts[`la${i}`] = () => acceptLetter(gid, i);
    acts[`ld${i}`] = () => declineLetter(gid, i);
  });
  html += `<button class="btn secondary" data-act="close">Закрыть</button>`;
  openModal(html, acts);
}

function acceptLetter(gid, i) {
  const g = groups[gid];
  const l = g.letters[i];
  if (!l) return;
  g.letters.splice(i, 1);

  if (!groups[l.from].enemies.includes(gid)) {
    saveGroups();
    return msg('Война уже закончилась.');
  }

  let extra;
  if (l.offer.type === 'money') {
    const sender = getUsers()[l.fromEmail];
    if (!sender || sender.money < l.offer.amount) {
      saveGroups();
      return msg('У отправителя не хватает денег. Договор не заключён, война продолжается.');
    }
    setUser(l.fromEmail, { money: sender.money - l.offer.amount });
    setUser(currentEmail, { money: me().money + l.offer.amount });
    extra = `Получено ${l.offer.amount} руб.`;
  } else {
    const s = sectors.find(x => x.id === l.offer.sid);
    if (s && s.owner === l.from) {
      s.owner = gid;
      saveSectors();
      drawSectors();
      extra = 'Точка передана вам.';
    } else {
      extra = 'Точка уже не принадлежала отправителю, передачи не было.';
    }
  }

  endWar(gid, l.from);
  saveGroups();
  renderMenu();
  msg(`Мир с «${groupName(l.from)}» заключён. ${extra}`);
}

function declineLetter(gid, i) {
  groups[gid].letters.splice(i, 1);
  saveGroups();
  renderMenu();
  msg('Письмо отклонено. Война продолжается.');
}

let mode = null;      // null | 'draw' | 'attack' | 'tpick'
let modeGid = null;
let drawPts = [];
let draftLayer = null;

function showHint(text, { undo = false, done = false } = {}) {
  document.getElementById('hintText').textContent = text;
  document.getElementById('hintUndo').classList.toggle('hidden', !undo);
  document.getElementById('hintDone').classList.toggle('hidden', !done);
  document.getElementById('hint').classList.add('active');
}

function cancelMode() {
  mode = null; modeGid = null; drawPts = [];
  if (draftLayer) draftLayer.clearLayers();
  hideHint();
  if (map) map.getContainer().style.cursor = '';
}

function startDraw(gid) {
  closeModal();

  showHint(`Рисуйте территорию «${groupName(gid)}»: кликайте по точкам по контуру. Минимум 3 точки.`, { undo: true, done: true });

  renderDraft();
}

function renderDraft() {
  draftLayer.clearLayers();
  const col = colorOf(modeGid);
  if (drawPts.length >= 2) L.polyline(drawPts, { color: col, weight: 2, dashArray: '4 4' }).addTo(draftLayer);
  drawPts.forEach(p => L.circleMarker(p, { radius: 4, color: '#fff', fillColor: col, fillOpacity: 1, weight: 1 }).addTo(draftLayer));
}

function finishDraw() {
  if (drawPts.length < 3) return msg('Нужно минимум 3 точки.');
  groups[modeGid].zone = drawPts.slice();
  saveGroups();
  const gid = modeGid;
  cancelMode();
  drawZones();
  msg(`Территория «${groupName(gid)}» сохранена.`);

function handleTreatyPick(gid, latlng) {
  const s = [...sectors].reverse().find(x => x.owner === gid && L.latLng(x.lat, x.lng).distanceTo(latlng) <= SECTOR_R);
  if (!s) return msg('Здесь нет вашей захваченной точки. Нажмите на свою точку.');
  treatyDraft.sid = s.id;
  cancelMode();
  showTreatyForm(gid);
}

document.getElementById('hintCancel').onclick = cancelMode;
document.getElementById('hintDone').onclick = finishDraw;
document.getElementById('hintUndo').onclick = () => { drawPts.pop(); renderDraft(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelMode(); });

// ================= ОПРЕДЕЛЕНИЕ ВЛАДЕЛЬЦА =================
function inPoly(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function ownerAt(latlng) {
  for (let i = sectors.length - 1; i >= 0; i--) {
    const s = sectors[i];
    if (L.latLng(s.lat, s.lng).distanceTo(latlng) <= SECTOR_R) return s.owner;
  }
  for (const d of GROUP_DEFS) {
    const z = groups[d.id].zone;
    if (z && inPoly(latlng.lat, latlng.lng, z)) return d.id;
  }
  return null;
}

// ================= АТАКА =================
function handleAttackPoint(from, latlng) {
  const target = ownerAt(latlng);
  if (!target) {
    captureSector(latlng.lat, latlng.lng, from);
    return msg(`Точка ничья. «${groupName(from)}» забирает её без боя.`);
  }
  if (target === from) return msg('Это уже ваша территория. Выберите чужую.');
  if (!groups[from].enemies.includes(target)) return msg(`Вы не воюете с «${groupName(target)}». Сначала объявите войну.`);
  const avail = available(from);
  if (avail < 1) return msg('Нет доступных людей: все в больнице или наёмники закончились.');
  openModal(`
    <h2>Атака</h2>
    <p>Точка у «${esc(groupName(target))}».</p>
    <p>Доступно людей: ${avail}</p>
    <input type="number" id="atkN" min="1" max="${avail}" value="${avail}">
    <button class="btn" data-act="send">Отправить</button>
    <button class="btn secondary" data-act="close">Отмена</button>
  `, {
    send: () => {
      const n = parseInt(document.getElementById('atkN').value, 10);
      if (isNaN(n) || n < 1 || n > available(from)) return msg(`Введите число от 1 до ${available(from)}.`);
      sendChallenge(from, target, latlng, n);
    }
  });
}

function sendChallenge(from, target, latlng, n) {
  const tg = groups[target];
  if (!tg.leader) {
    captureSector(latlng.lat, latlng.lng, from);
    return msg(`У «${groupName(target)}» нет главаря. «${groupName(from)}» забирает точку.`);
  }
  tg.challenges.push({ id: rnd(), from, target, lat: latlng.lat, lng: latlng.lng, attackers: n });
  saveGroups();
  msg(`Вызов отправлен лидеру «${groupName(target)}». Ждём ответа.`);
}

function showDefend(gid, chId) {
  const ch = groups[gid].challenges.find(c => c.id === chId);
  if (!ch) return msg('Вызов уже неактуален.');
  const avail = available(gid);
  openModal(`
    <h2>Вызов</h2>
    <p>«${esc(groupName(ch.from))}» атакует точку на вашей территории. Атакующих: ${ch.attackers}.</p>
    <p>Доступно у вас: ${avail}</p>
    <input type="number" id="defN" min="0" max="${avail}" value="${avail}">
    <button class="btn" data-act="go">Защищать</button>
    <button class="btn secondary" data-act="close">Закрыть</button>
  `, {
    go: () => {
      const n = parseInt(document.getElementById('defN').value, 10);
      if (isNaN(n) || n < 0 || n > available(gid)) return msg('Неверное число людей.');
      respondChallenge(gid, chId, n);
    }
  });
}

function respondChallenge(gid, chId, d) {
  const g = groups[gid];
  const ch = g.challenges.find(c => c.id === chId);
  if (!ch) return msg('Вызов уже неактуален.');
  g.challenges = g.challenges.filter(c => c.id !== chId);
  const a = ch.attackers;
  let text;
  if (a > d) {
    captureSector(ch.lat, ch.lng, ch.from);
    if (d > 0) sendToHospital(gid, d);
    text = `«${groupName(ch.from)}» захватил точку. Защитники (${d}) в больнице на 30 сек.`;
  } else {
    sendToHospital(ch.from, a);
    text = `«${groupName(gid)}» отбил атаку. Атакующие (${a}) в больнице на 30 сек.`;
  }
  saveGroups();
  playBattle(ch.lat, ch.lng, a, d);
  setTimeout(() => msg(text), 1500);
}

// ================= КАРТА =================
let map = null;
let zoneLayer = null;
let sectorLayer = null;
let battleLayer = null;

document.getElementById('btnPlay').onclick = () => { showScreen('game'); initMap(); };
document.getElementById('btnBack').onclick = () => { cancelMode(); showScreen('menu'); };

function drawZones() {
  zoneLayer.clearLayers();
  GROUP_DEFS.forEach(d => {
    const z = groups[d.id].zone;
    if (!z) return;
    L.polygon(z, { color: d.color, weight: 2, fillColor: d.color, fillOpacity: 0.85 })
      .addTo(zoneLayer)
      .bindTooltip(() => tooltipHtml(d.id), { sticky: true })
      .on('dblclick', () => onGroupDblClick(d.id));
  });
}

function captureSector(lat, lng, owner) {
  sectors.push({ id: rnd(), lat, lng, owner });
  saveSectors();
  drawSectors();
}

function drawSectors() {
  sectorLayer.clearLayers();
  sectors.forEach(s => {
    const col = colorOf(s.owner);
    L.circle([s.lat, s.lng], { radius: SECTOR_R, color: col, fillColor: col, fillOpacity: 0.8, weight: 2 })
      .addTo(sectorLayer)
      .bindTooltip(() => sectorTooltip(s), { sticky: true })
      .on('dblclick', () => onGroupDblClick(s.owner));
  });
}

function playBattle(lat, lng, a, d) {
  battleLayer.clearLayers();
  const spacing = 0.00004;
  const icon = cls => L.divIcon({ className: '', html: `<div class="man ${cls}"></div>`, iconSize: [8, 14], iconAnchor: [4, 7] });
  const sa = Math.min(a, 30), sd = Math.min(d, 30);
  for (let i = 0; i < sa; i++) {
    const la = lat + (i - (sa - 1) / 2) * spacing;
    L.marker([la, lng - 0.0002], { icon: icon('att'), interactive: false }).addTo(battleLayer);
  }
  for (let i = 0; i < sd; i++) {
    const la = lat + (i - (sd - 1) / 2) * spacing;
    L.marker([la, lng + 0.0002], { icon: icon('def'), interactive: false }).addTo(battleLayer);
  }
  setTimeout(() => battleLayer.clearLayers(), 6000);
}

function initMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 100); return; }

  map = L.map('map', { doubleClickZoom: false }).setView([55.8325, 37.9710], 16);
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics' }
  ).addTo(map);

  zoneLayer = L.layerGroup().addTo(map);
  sectorLayer = L.layerGroup().addTo(map);
  battleLayer = L.layerGroup().addTo(map);
  draftLayer = L.layerGroup().addTo(map);
  drawZones();
  drawSectors();

  map.on('click', e => {
    if (mode === 'draw') {
      drawPts.push([e.latlng.lat, e.latlng.lng]);
      renderDraft();
    } else if (mode === 'attack') {
      const from = modeGid;
      cancelMode();
      handleAttackPoint(from, e.latlng);
    } else if (mode === 'tpick') {
      handleTreatyPick(modeGid, e.latlng);
    }
  });

  setTimeout(() => map.invalidateSize(), 100);
}

// ================= СТАРТ =================
(function init() {
  // у старых точек могло не быть id
  let fixed = false;
  sectors.forEach(s => { if (!s.id) { s.id = rnd(); fixed = true; } });
  if (fixed) saveSectors();

  const session = localStorage.getItem(SESSION_KEY);
  if (session && getUsers()[session]) openMenu(session);
  else showScreen('auth');
})();
</script>

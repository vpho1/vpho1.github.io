<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раен Балашиха</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d0d0d; color: #eee; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* AUTH */
  #auth { align-items: center; justify-content: center; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 90%; max-width: 360px; }
  .card h1 { text-align: center; margin-bottom: 20px; color: #e53935; letter-spacing: 1px; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid #333; }
  .tabs button { flex: 1; padding: 10px; background: none; border: none; color: #888; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #fff; border-bottom-color: #e53935; }
  form { display: none; flex-direction: column; }
  form.active { display: flex; }
  input { padding: 11px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; }
  input:focus { outline: none; border-color: #e53935; }
  .error { color: #ff5252; font-size: 14px; min-height: 18px; margin-bottom: 8px; text-align: center; }
  .btn { padding: 12px; background: #e53935; border: none; color: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 8px; }
  .btn:hover { background: #c62828; }
  .btn.secondary { background: #333; }
  .btn.secondary:hover { background: #444; }

  /* MENU */
  #menu { align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  #menu h1 { font-size: 40px; color: #e53935; letter-spacing: 2px; }
  #menu p { color: #aaa; margin-bottom: 20px; }
  #menu .menu-btns { width: 90%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

  /* GAME */
  #game { flex-direction: column; height: 100vh; }
  .topbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #1a1a1a; border-bottom: 1px solid #333; }
  .topbar span { font-weight: bold; color: #e53935; }
  .topbar .btn { width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
  #atkBanner { display: none; flex: none; background: #e53935; color: #fff; padding: 8px 14px; align-items: center; justify-content: space-between; font-size: 14px; }
  #atkBanner.active { display: flex; }
  #atkBanner button { width: auto; padding: 6px 10px; font-size: 13px; background: #333; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
  #alerts { flex: none; }
  .alert { background: #2a1212; border: 1px solid #e53935; border-radius: 8px; padding: 8px 12px; margin: 6px 14px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
  .alert.info { border-color: #555; background: #1a1a1a; }
  .alert .btn { width: auto; padding: 6px 10px; font-size: 13px; margin: 0; }
  #news { flex: none; font-size: 13px; color: #bbb; padding: 6px 14px; min-height: 22px; }
  #map { flex: 1; width: 100%; }
  .leaflet-tooltip { background: #1a1a1a; color: #fff; border: 1px solid #444; font-size: 13px; }

  /* BATTLE FIGURES */
  .bt-icon { background: none; border: none; }
  .battle-pt { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .fig-row { position: absolute; top: -8px; display: flex; gap: 2px; white-space: nowrap; }
  .fig-row.att { right: 0; }
  .fig-row.def { left: 0; }
  .fig-row svg { flex: none; }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-bg.active { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 22px; width: 90%; max-width: 340px; color: #eee; max-height: 90vh; overflow-y: auto; }
  .modal h2 { color: #e53935; margin-bottom: 12px; font-size: 20px; }
  .modal p { margin-bottom: 8px; line-height: 1.4; }
</style>
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="auth" class="screen active">
  <div class="card">
    <h1>РАЕН БАЛАШИХА</h1>
    <div class="tabs">
      <button id="tabLogin" class="active">Вход</button>
      <button id="tabRegister">Регистрация</button>
    </div>

    <form id="loginForm" class="active">
      <input type="email" id="loginEmail" placeholder="Почта" required>
      <input type="password" id="loginPass" placeholder="Пароль" required>
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn">Войти</button>
    </form>

    <form id="registerForm">
      <input type="text" id="regNick" placeholder="Никнейм" required>
      <input type="text" id="regCallsign" placeholder="Позывной" required>
      <input type="email" id="regEmail" placeholder="Почта" required>
      <input type="password" id="regPass" placeholder="Пароль (минимум 6 символов)" required>
      <div class="error" id="regError"></div>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
  </div>
</div>

<!-- МЕНЮ -->
<div id="menu" class="screen">
  <h1>РАЕН</h1>
  <p id="welcome"></p>
  <div class="menu-btns">
    <button class="btn" id="btnPlay">Начать игру</button>
    <button class="btn secondary" id="btnLogout">Выйти</button>
  </div>
</div>

<!-- ИГРА -->
<div id="game" class="screen">
  <div class="topbar">
    <span>Балашиха</span>
    <button class="btn secondary" id="btnBack">← В меню</button>
  </div>
  <div id="atkBanner">
    <span>Нажмите на территорию врага на карте</span>
    <button id="atkCancel">Отмена</button>
  </div>
  <div id="alerts"></div>
  <div id="news"></div>
  <div id="map"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modalBg" class="modal-bg">
  <div class="modal" id="modalBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ================= НАСТРОЙКИ =================
const MAX_MEMBERS = 30;
const HOSPITAL_MS = 30000;   // 30 секунд в больнице
const DEFEND_MS = 120000;    // сколько ждём ответа защитника (2 минуты)
const DONE_SHOW_MS = 8000;   // сколько секунд видно бой на карте

// Группировка = территория. Координаты в формате [долгота, широта].
const TERRITORIES = [
  {
    id: 'univ', name: 'Универсам', color: '#2e7d32',
    coords: [
      [37.9715151,55.830116],[37.9716861,55.8329778],[37.9720623,55.8335059],[37.9724042,55.8338516],
      [37.9726094,55.8341973],[37.972712,55.8347158],[37.9729514,55.8357145],[37.9731395,55.8358489],
      [37.9775388,55.8361843],[37.9799971,55.8363796],[37.9813945,55.8364301],[37.9827356,55.8363598],
      [37.9827506,55.8362197],[37.9771303,55.8300152],[37.9715188,55.8301033],[37.971515,55.830116]
    ]
  },
  {
    id: 'kino', name: 'Кинопленка', color: '#7b1fa2',
    coords: [
      [37.9714177,55.8302632],[37.9692348,55.8303511],[37.9675265,55.8303876],[37.9674011,55.8303437],
      [37.9673033,55.8302627],[37.967233,55.8301454],[37.9669636,55.8301165],[37.9668064,55.8301315],
      [37.9667602,55.8301906],[37.9666925,55.8302589],[37.9661644,55.8301113],[37.9660459,55.8297948],
      [37.9652847,55.8296129],[37.9650373,55.8297665],[37.9648258,55.8297606],[37.9636098,55.8293478],
      [37.9617242,55.8313916],[37.9616905,55.831552],[37.961707,55.8316989],[37.961803,55.8318712],
      [37.9620437,55.8320218],[37.9643258,55.8331658],[37.9654062,55.8334938],[37.9658121,55.8335949],
      [37.9664041,55.8336715],[37.9671743,55.8337178],[37.9681281,55.8337385],[37.9717806,55.8335139],
      [37.9714178,55.8302633],[37.9713574,55.8302547]
    ]
  },
  {
    id: 'chainiki', name: 'Чайники', color: '#757575',
    coords: [
      [37.9713474,55.8302366],[37.96923,55.8302822],[37.967532,55.8302476],[37.9672775,55.8300489],
      [37.9668316,55.8299979],[37.9664408,55.830046],[37.9662634,55.829985],[37.9660489,55.8297247],
      [37.9662013,55.8295276],[37.9655731,55.8293228],[37.9640728,55.8289181],[37.9668417,55.8259621],
      [37.9672796,55.8260639],[37.9689658,55.82604],[37.9692017,55.8258553],[37.9699848,55.8258091],
      [37.97095,55.8257788],[37.9711901,55.8258002],[37.9713471,55.8302366],[37.9712636,55.8302028]
    ]
  }
];

const T = id => TERRITORIES.find(t => t.id === id);
const gname = id => id ? T(id).name : '';
const gcolor = id => id ? T(id).color : '#999';

// ================= СОСТОЯНИЕ ИГРЫ =================
// owner[zone] — какая группировка владеет территорией
// groups[gid] — лидер, участники, с кем война, больница
// battles — текущие атаки
const STATE_KEY = 'raen_state_v2';
function freshState() {
  const s = { groups: {}, owner: {}, battles: [], news: [] };
  TERRITORIES.forEach(t => {
    s.groups[t.id] = { leader: null, members: [], enemy: null, hospital: [] };
    s.owner[t.id] = t.id;
  });
  return s;
}
let S = JSON.parse(localStorage.getItem(STATE_KEY) || 'null') || freshState();
function saveS() { localStorage.setItem(STATE_KEY, JSON.stringify(S)); }
function news(text) { S.news.unshift(text); S.news = S.news.slice(0, 5); }

// ================= ПОЛЬЗОВАТЕЛИ =================
const USERS_KEY = 'raen_users';
const SESSION_KEY = 'raen_session';
let currentEmail = null;

function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function setUser(email, data) { const u = getUsers(); u[email] = { ...u[email], ...data }; saveUsers(u); }
const me = () => getUsers()[currentEmail];

async function hashPass(text) {
  if (!window.crypto || !crypto.subtle) return text;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function displayName(email) {
  const u = getUsers()[email];
  return u ? `${u.nick} (${u.callsign})` : '—';
}

// ================= ЛЮДИ В ГРУППИРОВКЕ =================
function hospitalNow(gid) {
  const now = Date.now();
  return S.groups[gid].hospital.filter(h => h.until > now).reduce((a, h) => a + h.n, 0);
}
function committed(gid) {
  return S.battles.filter(b => b.status === 'wait' && b.att === gid).reduce((a, b) => a + b.att_n, 0);
}
function freeCount(gid) {
  return Math.max(0, S.groups[gid].members.length - hospitalNow(gid) - committed(gid));
}

// ================= ЭКРАНЫ =================
const screens = {
  auth: document.getElementById('auth'),
  menu: document.getElementById('menu'),
  game: document.getElementById('game')
};
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// ================= ВХОД / РЕГИСТРАЦИЯ =================
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

tabLogin.onclick = () => {
  tabLogin.classList.add('active'); tabRegister.classList.remove('active');
  loginForm.classList.add('active'); registerForm.classList.remove('active');
};
tabRegister.onclick = () => {
  tabRegister.classList.add('active'); tabLogin.classList.remove('active');
  registerForm.classList.add('active'); loginForm.classList.remove('active');
};

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('regError');
  err.textContent = '';
  const nick = document.getElementById('regNick').value.trim();
  const callsign = document.getElementById('regCallsign').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;

  if (!nick || !callsign || !email || !pass) { err.textContent = 'Заполните все поля'; return; }
  if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
  const users = getUsers();
  if (users[email]) { err.textContent = 'Такая почта уже зарегистрирована'; return; }

  users[email] = { nick, callsign, pass: await hashPass(pass), group: null, role: null };
  saveUsers(users);
  localStorage.setItem(SESSION_KEY, email);
  registerForm.reset();
  openMenu(email);
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginError');
  err.textContent = '';
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const user = getUsers()[email];
  if (!user) { err.textContent = 'Пользователь не найден'; return; }
  if (user.pass !== await hashPass(pass)) { err.textContent = 'Неверный пароль'; return; }
  localStorage.setItem(SESSION_KEY, email);
  loginForm.reset();
  openMenu(email);
});

// ================= МЕНЮ =================
function openMenu(email) {
  currentEmail = email;
  const user = getUsers()[email];
  const g = user.group ? ` | группировка: ${gname(user.group)}` : '';
  document.getElementById('welcome').textContent = `Привет, ${user.nick} (${user.callsign})${g}`;
  showScreen('menu');
}
document.getElementById('btnLogout').onclick = () => {
  localStorage.removeItem(SESSION_KEY);
  currentEmail = null;
  showScreen('auth');
};

// ================= МОДАЛКА =================
const modalBg = document.getElementById('modalBg');
const modalBody = document.getElementById('modalBody');
let modalActs = {};
modalBody.addEventListener('click', e => {
  const a = e.target.dataset.act;
  if (a && modalActs[a]) modalActs[a]();
});
function openModal(html, acts = {}) {
  modalActs = { close: closeModal, ...acts };
  modalBody.innerHTML = html;
  modalBg.classList.add('active');
}
function closeModal() { modalBg.classList.remove('active'); }
function msg(text) {
  openModal(`<p>${esc(text)}</p><button class="btn" data-act="close">OK</button>`);
}

// ================= ГРУППИРОВКИ: ВСТУПЛЕНИЕ =================
function zoneTip(z) {
  const o = S.owner[z.id];
  const g = S.groups[o];
  return `<b>${esc(gname(o))}</b><br>Территория: ${esc(z.name)}<br>` +
    `Лидер: ${g.leader ? esc(displayName(g.leader)) : 'нет'}<br>` +
    `Воюет с: ${g.enemy ? esc(gname(g.enemy)) : 'ни с кем'}`;
}

function onZoneDbl(z) {
  if (attackMode) return;
  const u = me();
  const owner = S.owner[z.id];
  if (u.group === owner) return showOwnGroup(owner);
  if (u.group) return msg(`Вы уже в группировке «${gname(u.group)}». Сначала выйдите из неё.`);
  showJoinMenu(owner);
}

function showJoinMenu(gid) {
  const g = S.groups[gid];
  openModal(`
    <h2>${esc(gname(gid))}</h2>
    <p>Вступить как:</p>
    <button class="btn" data-act="leader">Главный${g.leader ? ' (занят)' : ''}</button>
    <button class="btn secondary" data-act="member">Шпана</button>
    <button class="btn secondary" data-act="close">Отмена</button>
  `, {
    leader: () => joinGroup(gid, 'leader'),
    member: () => joinGroup(gid, 'member')
  });
}

function joinGroup(gid, role) {
  const g = S.groups[gid];
  const email = currentEmail;
  if (role === 'leader') {
    if (g.leader) return msg(`Главный уже есть: ${displayName(g.leader)}. Вступите как шпана.`);
    g.leader = email;
  } else if (g.members.length >= MAX_MEMBERS) {
    return msg('В группировке нет мест (максимум 30).');
  }
  if (!g.members.includes(email)) g.members.push(email);
  saveS();
  setUser(email, { group: gid, role });
  msg(`Вы вступили в «${gname(gid)}» как ${role === 'leader' ? 'главный' : 'шпана'}.`);
  renderAll();
}

// ================= СВОЯ ГРУППИРОВКА =================
function showOwnGroup(gid) {
  const g = S.groups[gid];
  const u = me();
  const isLeader = u.role === 'leader';
  const zones = TERRITORIES.filter(t => S.owner[t.id] === gid).length;

  let html = `
    <h2>${esc(gname(gid))}</h2>
    <p>Лидер: ${g.leader ? esc(displayName(g.leader)) : 'нет'}</p>
    <p>Людей: ${g.members.length} / ${MAX_MEMBERS}</p>
    <p>В больнице: ${hospitalNow(gid)} · Свободно: ${freeCount(gid)}</p>
    <p>Территорий: ${zones}</p>
    <p>Воюет с: ${g.enemy ? esc(gname(g.enemy)) : 'ни с кем'}</p>
    <p>Вы: ${isLeader ? 'главный' : 'шпана'}</p>
  `;
  const acts = { leave: () => leaveGroup(gid) };

  if (isLeader) {
    html += `
      <button class="btn" data-act="war">Война</button>
      <button class="btn secondary" data-act="trade">Торговля</button>
      <button class="btn secondary" data-act="diplo">Дипломатия</button>`;
    acts.war = () => showWar(gid);
    acts.trade = () => msg('Торговля: скоро');
    acts.diplo = () => msg('Дипломатия: скоро');
  } else {
    const label = g.leader ? `Стать лидером (сейчас: ${displayName(g.leader)})` : 'Стать главным';
    html += `<button class="btn secondary" data-act="takeover">${esc(label)}</button>`;
    acts.takeover = () => takeLeadership(gid);
  }
  html += `<button class="btn secondary" data-act="leave">Выйти из группировки</button>`;
  openModal(html, acts);
}

function takeLeadership(gid) {
  if (!confirm('Стать главным этой группировки?')) return;
  const g = S.groups[gid];
  if (g.leader && g.leader !== currentEmail) setUser(g.leader, { role: 'member' });
  g.leader = currentEmail;
  saveS();
  setUser(currentEmail, { role: 'leader' });
  renderAll();
  showOwnGroup(gid);
}

function leaveGroup(gid) {
  const g = S.groups[gid];
  const email = currentEmail;
  g.members = g.members.filter(e => e !== email);
  if (g.leader === email) g.leader = null;
  saveS();
  setUser(email, { group: null, role: null });
  renderAll();
  msg(`Вы вышли из «${gname(gid)}».`);
}

// ================= ВОЙНА =================
function showWar(gid) {
  const g = S.groups[gid];
  if (g.enemy) {
    openModal(`
      <h2>Война</h2>
      <p>Воюем с: «${esc(gname(g.enemy))}»</p>
      <p>Чтобы атаковать, нажмите на территорию врага на карте.</p>
      <button class="btn" data-act="atk">Выбрать точку атаки</button>
      <button class="btn secondary" data-act="close">Закрыть</button>
    `, {
      atk: () => { closeModal(); setAttackMode(true); }
    });
    return;
  }

  const acts = {};
  let buttons = '';
  TERRITORIES.filter(t => t.id !== gid).forEach(t => {
    const busy = S.groups[t.id].enemy ? ' (в войне)' : '';
    buttons += `<button class="btn secondary" data-act="w:${t.id}">Объявить войну: ${esc(t.name)}${busy}</button>`;
    acts['w:' + t.id] = () => declareWar(gid, t.id);
  });
  openModal(`<h2>Война</h2><p>Выберите группировку:</p>${buttons}
    <button class="btn secondary" data-act="close">Отмена</button>`, acts);
}

function declareWar(a, d) {
  const A = S.groups[a], D = S.groups[d];
  if (A.enemy || D.enemy) return msg('Одна из группировок уже в войне.');
  A.enemy = d;
  D.enemy = a;
  news(`«${gname(a)}» объявила войну «${gname(d)}»`);
  saveS();
  renderAll();
  msg(`Война объявлена: «${gname(d)}»`);
}

// ================= АТАКА =================
let attackMode = false;
function setAttackMode(on) {
  attackMode = on;
  document.getElementById('atkBanner').classList.toggle('active', on);
}
document.getElementById('atkCancel').onclick = () => setAttackMode(false);

function onAttackClick(z, latlng) {
  const u = me();
  const owner = S.owner[z.id];
  if (u.role !== 'leader' || !u.group) return msg('Атаковать может только главный.');
  if (owner === u.group) return msg('Это ваша территория.');
  if (S.groups[u.group].enemy !== owner) return msg('Вы не в войне с этой группировкой.');
  askAttack(z, latlng);
}

function askAttack(z, latlng) {
  const avail = freeCount(me().group);
  if (avail < 1) return msg('Нет свободных людей (часть в больнице или уже в бою).');
  openModal(`
    <h2>Атака: ${esc(z.name)}</h2>
    <p>Группировка: «${esc(gname(S.owner[z.id]))}»</p>
    <p>Свободно людей: ${avail}</p>
    <input type="number" id="atkN" min="1" max="${avail}" value="${Math.min(avail, 10)}">
    <button class="btn" data-act="go">Атаковать</button>
    <button class="btn secondary" data-act="close">Отмена</button>
  `, {
    go: () => {
      const n = parseInt(document.getElementById('atkN').value, 10);
      if (!(n >= 1 && n <= avail)) return msg(`Введите число от 1 до ${avail}`);
      setAttackMode(false);
      startAttack(z, latlng, n);
    }
  });
}

function startAttack(z, latlng, n) {
  const attG = me().group;
  const defG = S.owner[z.id];
  const b = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    att: attG, def: defG, zone: z.id,
    lat: latlng.lat, lng: latlng.lng,
    att_n: n, def_n: null,
    status: 'wait', expires: Date.now() + DEFEND_MS, doneAt: 0
  };
  S.battles.push(b);
  // если у защиты нет главаря — территория забирается сразу
  if (!S.groups[defG].leader) resolveBattle(b, 0);
  saveS();
  renderAll();
}

// защитник выставляет людей
function askDefend(b) {
  const avail = freeCount(b.def);
  openModal(`
    <h2>Защита: ${esc(T(b.zone).name)}</h2>
    <p>Нападает: «${esc(gname(b.att))}», ${b.att_n} чел.</p>
    <p>Свободно у вас: ${avail}</p>
    <input type="number" id="defN" min="0" max="${avail}" value="${Math.min(avail, 10)}">
    <button class="btn" data-act="go">Защищать</button>
    <button class="btn secondary" data-act="close">Не отвечать</button>
  `, {
    go: () => {
      const n = parseInt(document.getElementById('defN').value, 10) || 0;
      defend(b, n);
    }
  });
}

function defend(b, n) {
  if (b.status !== 'wait') return closeModal();
  const avail = freeCount(b.def);
  if (n < 0 || n > avail) return msg(`Можно выставить от 0 до ${avail}`);
  resolveBattle(b, n);
  saveS();
  closeModal();
  renderAll();
}

// итог боя
function resolveBattle(b, defN) {
  b.def_n = defN;
  b.status = 'done';
  b.doneAt = Date.now();
  const attWins = b.att_n > defN;   // при равенстве побеждает защита
  if (attWins) S.owner[b.zone] = b.att;

  // проигравшие уходят в больницу на 30 секунд
  const loser = attWins ? b.def : b.att;
  const loserN = attWins ? defN : b.att_n;
  if (loser && loserN > 0) {
    S.groups[loser].hospital.push({ n: loserN, until: Date.now() + HOSPITAL_MS });
  }

  const zn = T(b.zone).name;
  news(attWins
    ? `«${gname(b.att)}» взяла «${zn}» (${b.att_n} против ${defN})`
    : `«${gname(b.def)}» отбила «${zn}» (${defN} против ${b.att_n})`);
}

// ================= ФИГУРКИ НА КАРТЕ =================
function figSvg(color) {
  return `<svg width="8" height="14" viewBox="0 0 8 14">
    <circle cx="4" cy="2.2" r="2" fill="${color}"/>
    <path d="M4 4.5v5M4 6L1 8.5M4 6l3 2.5M4 9.5L1.5 13M4 9.5l2.5 3.5" stroke="${color}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function figs(n, color) {
  return figSvg(color).repeat(Math.min(n, MAX_MEMBERS));
}

// ================= ВЫЗОВЫ И ИНФО =================
let alertsKey = '';
function renderAlerts() {
  const box = document.getElementById('alerts');
  const u = currentEmail ? me() : null;
  if (!u) return;
  let html = '';
  const parts = [];

  // вызовы для защитника (главный группировки, на которую напали)
  S.battles.filter(b => b.status === 'wait' && u.role === 'leader' && u.group && b.def === u.group && S.groups[b.def].leader === currentEmail)
    .forEach(b => {
      parts.push(b.id);
      html += `<div class="alert"><span>Вызов от «${esc(gname(b.att))}» на «${esc(T(b.zone).name)}»: ${b.att_n} чел.</span>
        <button class="btn" data-bid="${b.id}">Ответить</button></div>`;
    });

  // ожидание для атакующего
  S.battles.filter(b => b.status === 'wait' && u.role === 'leader' && u.group && b.att === u.group)
    .forEach(b => {
      parts.push('a' + b.id);
      const t = new Date(b.expires).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      html += `<div class="alert info"><span>Ждём ответа «${esc(gname(b.def))}» на «${esc(T(b.zone).name)}» до ${t}</span></div>`;
    });

  const key = parts.join(',');
  if (key === alertsKey) return;
  alertsKey = key;
  box.innerHTML = html;
}

document.getElementById('alerts').addEventListener('click', e => {
  const id = e.target.dataset.bid;
  if (!id) return;
  const b = S.battles.find(x => x.id === id);
  if (b && b.status === 'wait') askDefend(b);
});

function renderNews() {
  document.getElementById('news').textContent = S.news.slice(0, 2).join('  ·  ');
}

// ================= КАРТА =================
let map = null;
let battleLayer = null;
const polys = {};

document.getElementById('btnPlay').onclick = () => {
  showScreen('game');
  initMap();
};
document.getElementById('btnBack').onclick = () => {
  setAttackMode(false);
  showScreen('menu');
};

function initMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 100); renderAll(); return; }

  map = L.map('map', { doubleClickZoom: false }).setView([55.8325, 37.9710], 16);
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics' }
  ).addTo(map);

  TERRITORIES.forEach(z => {
    const poly = L.polygon(z.coords.map(c => [c[1], c[0]]), {
      weight: 2, fillOpacity: 0.85
    }).addTo(map);
    poly.bindTooltip(() => zoneTip(z), { sticky: true });
    poly.on('click', e => { if (attackMode) onAttackClick(z, e.latlng); });
    poly.on('dblclick', () => onZoneDbl(z));
    polys[z.id] = poly;
  });

  battleLayer = L.layerGroup().addTo(map);
  renderAll();
  setTimeout(() => map.invalidateSize(), 100);
}

function renderZones() {
  TERRITORIES.forEach(z => {
    const c = gcolor(S.owner[z.id]);
    if (polys[z.id]) polys[z.id].setStyle({ color: c, fillColor: c });
  });
}

function renderBattles() {
  battleLayer.clearLayers();
  S.battles.forEach(b => {
    const left = `<div class="fig-row att">${figs(b.att_n, gcolor(b.att))}</div>`;
    const right = (b.def_n && b.def_n > 0) ? `<div class="fig-row def">${figs(b.def_n, gcolor(b.def))}</div>` : '';
    L.marker([b.lat, b.lng], {
      interactive: false,
      icon: L.divIcon({
        className: 'bt-icon',
        html: `<div class="battle-pt">${left}${right}</div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      })
    }).addTo(battleLayer);
  });
}

function renderAll() {
  if (!map) return;
  renderZones();
  renderBattles();
  renderAlerts();
  renderNews();
}

// ================= ТАЙМЕР =================
function tick() {
  const now = Date.now();
  let changed = false;

  // время ответа вышло: защита не ответила, атака проходит
  S.battles.forEach(b => {
    if (b.status === 'wait' && now >= b.expires) { resolveBattle(b, 0); changed = true; }
  });
  // убираем старые бои с карты
  S.battles = S.battles.filter(b => b.status === 'wait' || now - b.doneAt < DONE_SHOW_MS);
  // выходим из больницы
  Object.values(S.groups).forEach(g => {
    const l = g.hospital.length;
    g.hospital = g.hospital.filter(h => h.until > now);
    if (g.hospital.length !== l) changed = true;
  });

  if (changed) saveS();
  renderAll();
}

// ================= СТАРТ =================
(function init() {
  const session = localStorage.getItem(SESSION_KEY);
  if (session && getUsers()[session]) openMenu(session);
  else showScreen('auth');
  setInterval(tick, 1000);
})();
</script>
